-   kind: TEST
    name: Test Cases
    id: TC
    file: 31-TEST-TC-Test-Cases.md
    desc: >
        The verifiable conditions and steps used to confirm that requirements, domain rules, use
        case scenarios, state transitions, and the mechanisms, procedures, and decisions of the
        architecture are correctly implemented, with mandatory defined inputs, mandatory expected
        outcomes, and optional pre- and post-conditions. The artifact is the last one, as a test
        case verifies objects of every preceding kind.

        Test cases are not derived from use cases alone: a use case scenario describes an intent-level
        flow, while a test case fixes the concrete data and the observable assertions that decide pass
        or fail, and many test cases (e.g. of Non-Functional Requirements or of cross-session rules)
        have no use case counterpart at all.
    optional: true
    refs: >
        -   ISO/IEC/IEEE 29119-3:2021: Software and systems engineering -- Software testing -- Part 3: Test documentation (2021),
            https://www.iso.org/standard/79429.html
        -   ISO/IEC/IEEE 29119-4:2021: Software and systems engineering -- Software testing -- Part 4: Test techniques (2021),
            https://www.iso.org/standard/79430.html
        -   ISTQB CTFL 4.0: Certified Tester Foundation Level Syllabus (2023),
            https://istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/
    diagram:
        type: grid
        nodes: "[[TEST-CASE:*]]"
        config:
            size-node-width-max: 440
            size-node-height-scale: 2
            grid-columns-max: 4
    childs:
        -   kind: TEST-CASE
            desc: >
                A single verifiable test case, named with a short (3-8 word) summary and defined by
                its mandatory input and expected outcome plus its optional pre- and post-conditions.

                The test case is at verification level: it pins down what the objects it verifies
                leave open, namely concrete data (e.g. `the correct six-digit token`), a boundary
                or equivalence class (e.g. `one more question within the same minute`), and an
                observable assertion, including the negative one (e.g. `the rejected question is
                not stored and the earlier questions remain unchanged`).

                A test case which merely rephrases a scenario in different words, adding none of these,
                is redundant and should be sharpened or dropped. Conversely, one scenario can require
                several test cases (one per boundary or equivalence class), and one test case can
                verify a requirement, a rule, and a scenario at once.

                A test case whose stimulus is a sequence rather than a single action carries the
                procedure in its body as sequentially numbered, imperative steps, mirroring the
                steps of a use case scenario (e.g. `1. The user logs in on device A. 2. The same
                user logs in on device B.`), with `INPUT` naming the decisive stimulus among them.

                A test case verifying an architecture element asserts the element itself, not the
                threshold behind it: a threshold is the `METRIC` of a Non-Functional Requirement and
                verified by referencing the requirement, while a Quality Perspectives tactic is
                referenced only when its mechanism is the assertion (e.g. that the failover switch
                happens, not how fast), an Operations View concern when its procedure is rehearsed
                (e.g. a restore drill), a Deployment View node or network when its topology is
                inspected (e.g. a port scan proving an `Isolated` segment), a component or
                concurrency unit when its collaboration or contention is exercised, an aspect of
                the Development Aspects or a Design Decisions decision when its rule is checked by
                an architectural fitness function (e.g. no dependency edge against the layering).
            diagram:
                type: hub
                center: self
                nodes: "[[TEST-CASE:*]], [[FR.REQUIREMENT:*]], [[NR.REQUIREMENT:*]], [[RULE:*]],
                    [[SCENARIO:*]], [[WORKFLOW:*]], [[TRANSITION:*]], [[ATTRIBUTE:*]],
                    [[PERMISSION:*]], [[ENDPOINT:*]], [[FRAME:*]], [[FV.COMPONENT:*]], [[UNIT:*]],
                    [[ASPECT:*]], [[NODE:*]], [[NETWORK:*]], [[CONCERN:*]], [[TACTIC:*]],
                    [[DECISION:*]]"
                labeled: true
                qualified: true
                config:
                    size-node-width-max: 440
                    size-node-height-scale: 1.75
            props:
                -   name: VERIFIES
                    desc: >
                        Comma-separated references to the FUNCTIONAL-REQUIREMENTS or
                        NON-FUNCTIONAL-REQUIREMENTS objects, the DOMAIN-RULES objects, the
                        USE-CASES scenario objects, the STATE-MODEL transition objects, the
                        DATA-MODEL attribute objects, the AUTHORIZATION-MODEL permission objects,
                        the INTERFACE-ENDPOINTS objects, the DIALOG-STORYBOARD frame objects, the
                        FUNCTIONALITY-VIEW, CONCURRENCY-VIEW, DEVELOPMENT-ASPECTS, DEPLOYMENT-VIEW
                        (node and network), OPERATIONS-VIEW, and QUALITY-PERSPECTIVES objects,
                        and/or the DESIGN-DECISIONS objects the test case verifies, so that a
                        scenario (in particular an `Exceptional` one, judged by its `OUTCOME`) is
                        covered by an acceptance test besides the requirements it exercises, a rule
                        (judged by the condition it states) is proven to hold, not just to be
                        documented, a transition (judged by its `GUARD` and the resulting state) is
                        proven to be permitted exactly as modeled, an attribute (judged by its
                        `TYPE` and `CONSTRAINT`) is proven to reject the values outside its range,
                        pattern, or invariant, a permission (judged by the operations it grants
                        and, the model being closed, by the ones it denies) is proven to be
                        enforced, an endpoint (judged by its arguments, options, and results) is
                        proven to honor its contract, a frame (judged by the dialog step it
                        storyboards) is proven to be reachable and to behave as storyboarded, a
                        component or unit (judged by its responsibility and dependencies) is proven
                        to collaborate and to withstand contention as modeled, an aspect (judged by
                        the rule it states) is proven to be obeyed by the source structure, a node
                        or network (judged by its `INSTANCES`, `PART-OF`, and `SCOPE`) is proven to
                        be deployed and isolated as modeled, a concern (judged by its procedure) is
                        proven to be performable, a tactic (judged by its `MECHANISM`) is proven to
                        take effect, and a decision (judged by its `WHAT`) is proven to be complied
                        with.
                    value: list([[REQUIREMENT:*]], [[RULE:*]], [[SCENARIO:*]], [[TRANSITION:*]],
                        [[ATTRIBUTE:*]], [[PERMISSION:*]], [[ENDPOINT:*]], [[FRAME:*]],
                        [[FV.COMPONENT:*]], [[UNIT:*]], [[ASPECT:*]], [[NODE:*]], [[NETWORK:*]],
                        [[CONCERN:*]], [[TACTIC:*]], [[DECISION:*]])
                -   name: WORKFLOWS
                    desc: >
                        Comma-separated references to the DOMAIN-WORKFLOWS objects the test case
                        walks through end to end, i.e. whose activities and handoffs its procedure
                        steps cross in order, so that the collaboration across actors and sittings
                        (not just the use cases of each single sitting) is proven to work as
                        modeled; omitted for a test case confined to a single sitting.
                    value: list([[WORKFLOW:*]])
                    optional: true
                -   name: PRE-CONDITION
                    desc: >
                        The state or setup that must hold before the test is executed.
                    optional: true
                -   name: INPUT
                    desc: >
                        The mandatory, concrete input data or action applied during the test, i.e.
                        the stimulus whose response the `EXPECTED` judges.
                -   name: EXPECTED
                    desc: >
                        The mandatory, concrete, observable response of the solution to the `INPUT`
                        (a message shown, a session issued, a submission rejected) that defines a
                        passing test, as opposed to the `POST-CONDITION` which is the state left
                        behind. When the test case verifies a NON-FUNCTIONAL-REQUIREMENTS object,
                        the expected response restates the `METRIC` threshold of that requirement
                        as the pass criterion (e.g. `p95 latency < 200 ms`) rather than a
                        qualitative phrase (e.g. `remains responsive`).
                -   name: POST-CONDITION
                    desc: >
                        The persisted state that must hold after the test completes (e.g. `the
                        authorization token is in state used`), including the state that must not
                        have changed (e.g. `no session token exists`), as opposed to the `EXPECTED`
                        which is the immediate response, and omitted for a test whose input leaves
                        no state behind.
                    optional: true

