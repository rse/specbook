-   kind: REQS
    name: Solution Vision
    id: SV
    file: 01-REQS-SV-Solution-Vision.md
    desc: >
        The high-level, aspirational description of the solution,
        capturing why it exists, whom it serves, what it is, which
        benefit it offers, how it differs from the alternatives, where
        its boundary runs, how its achievement is measured, and the
        desired future state it aims to achieve. Every vision aspect is
        stated in a concise (1-3 sentence) paragraph in an aspirational
        but unambiguous tone.
    optional: true
    refs: >
        -   ISO/IEC/IEEE 29148:2018: Systems and software engineering -- Life cycle processes -- Requirements engineering (2018),
            https://www.iso.org/standard/72089.html
        -   Moore: Crossing the Chasm, 3rd ed. (2014),
            https://www.harperbusiness.com/book/9780062293008/Crossing-the-Chasm-3rd-Edition-Geoffrey-A.-Moore/
        -   Pichler: The Product Vision Board (2011),
            https://www.romanpichler.com/tools/product-vision-board/
    props:
        -   name: PURPOSE
            desc: >
                Why the solution exists.
        -   name: TARGET-AUDIENCE
            desc: >
                Whom the solution serves.
        -   name: SOLUTION
            desc: >
                What the solution is, in a single sentence naming its kind or
                category (e.g. a self-hosted, browser-based streaming platform).
        -   name: VALUE-PROPOSITION
            desc: >
                The benefit the solution offers its target audience, stated in
                absolute terms without reference to alternatives.
        -   name: DIFFERENTIATORS
            desc: >
                How the solution stands apart from the alternatives, naming the
                alternatives it is compared against (including the status quo).
            optional: true
        -   name: SCOPE
            desc: >
                The boundary of the solution, stating what it deliberately does
                *not* cover and which adjacent concerns are left to others.
            optional: true
        -   name: SUCCESS-CRITERIA
            desc: >
                The measurable business outcomes by which the achievement of the
                vision is judged (e.g. adoption, cost, or time-to-value targets).
            optional: true
        -   name: FUTURE-STATE
            desc: >
                The desired outcome once the solution is adopted, describing what
                is true then that is not true today.
            optional: true

-   kind: REQS
    name: Solution Premises
    id: SP
    file: 02-REQS-SP-Solution-Premises.md
    desc: >
        The premises the specification rests on but cannot guarantee itself: the assumptions
        held true without proof, the dependencies on parties and systems outside the solution,
        and the risks whose occurrence would endanger it, each rated by the likelihood and
        the impact of its failure and stating what follows then, so that the requirements
        resting on a premise are known and revisited once it turns out to be false. The
        artifact complements the Solution Vision: the vision states what the solution aims
        for, the premises state what it takes as given on the way there.

        The premises are not constraints: a constraint is imposed on the solution and belongs
        to the Non-Functional Requirements or the Domain Rules, whereas a premise lies outside
        the control of the solution.
    optional: true
    refs: >
        -   ISO/IEC/IEEE 29148:2018: Systems and software engineering -- Life cycle processes -- Requirements engineering (2018),
            https://www.iso.org/standard/72089.html
        -   Robertson/Robertson: Volere Requirements Specification Template, 18th ed. (2018),
            https://www.volere.org/templates/volere-requirements-specification-template/
        -   ISO 31000:2018: Risk management -- Guidelines (2018),
            https://www.iso.org/standard/65694.html
        -   Boehm: Software Risk Management: Principles and Practices, IEEE Software 8(1) (1991),
            https://doi.org/10.1109/52.62930
    diagram:
        type: grid
        nodes: "[[PREMISE:*]]"
        properties:
            -   TYPE
            -   FAILURE-LIKELIHOOD
            -   FAILURE-IMPACT
        config:
            size-node-width-max: 440
            size-node-height-scale: 1.75
            grid-columns-max: 5
    children:
        -   kind: PREMISE
            desc: >
                A single premise, named with a short (3-8 word) summary phrased as the fact taken
                as given or the event feared (e.g. `Streaming Providers Deliver the Video`, `Access
                URLs Forwarded Beyond the Audience`) and described in a concise (1-3 sentence)
                paragraph as a declarative statement of what is held true (an `Assumption` or
                `Dependency`) or what may happen (a `Risk`), plus a 1-sentence rationale ("why")
                stating the evidence or agreement the premise rests on or the cause the risk stems
                from.

                A premise is outside the control of the solution (a condition the solution
                enforces itself is a Domain Rule or a Non-Functional Requirement instead) and
                states a fact or event, not a decision (a deliberate exclusion is the `SCOPE` of
                the Solution Vision or a `WONT` requirement instead).
            format:
                maxTableColumns: 5
            props:
                -   name: TYPE
                    desc: >
                        The kind of premise: `Assumption` (a fact about the domain, the users,
                        or the environment held true without proof, whose falsity changes the
                        requirements), `Dependency` (a reliance on a party, system, or
                        deliverable outside the solution, which has to be available and to
                        behave as agreed), or `Risk` (an uncertain event which, if it occurs,
                        harms the achievement of the vision).
                    value: enum(Assumption,Dependency,Risk)
                -   name: FAILURE-LIKELIHOOD
                    desc: >
                        The likelihood that the premise fails, i.e. that the assumption turns out
                        to be false, the dependency is not honored, or the risk occurs: `Low`,
                        `Medium`, or `High`. It rates the failure and not the premise itself, so
                        `Low` says that the premise most probably holds.
                    value: enum(Low,Medium,High)
                -   name: FAILURE-IMPACT
                    desc: >
                        The severity of the `CONSEQUENCE` for the solution once the premise fails:
                        `Low`, `Medium`, or `High`, so that the product of the failure likelihood
                        and the failure impact ranks the premises by the attention they need.
                    value: enum(Low,Medium,High)
                -   name: CONSEQUENCE
                    desc: >
                        What concretely follows for the solution if the premise fails, stated
                        as a 1-2 sentence description of the harm (e.g. `attendees cannot enter
                        the event`), justifying the `FAILURE-IMPACT` rating.
                -   name: MITIGATION
                    desc: >
                        What is done to lower the likelihood or the impact of the failure or to
                        detect it early (e.g. a fallback, a contract, a load test), omitted for
                        a premise whose failure is knowingly accepted.
                    optional: true

-   kind: REQS
    name: Domain Glossary
    id: DG
    file: 03-REQS-DG-Domain-Glossary.md
    desc: >
        The ubiquitous language of the domain, defining the meaning of each domain term in business
        language, together with its synonyms, its place in the hierarchy of terms, and the terms it
        has to be kept apart from, shared consistently across all Artifacts.
    optional: true
    refs: >
        -   ISO 704:2022: Terminology work -- Principles and methods (2022),
            https://www.iso.org/standard/79077.html
        -   ISO 1087:2019: Terminology work and terminology science -- Vocabulary (2019),
            https://www.iso.org/standard/62330.html
        -   Evans: Domain-Driven Design: Tackling Complexity in the Heart of Software (2003),
            https://www.domainlanguage.com/ddd/
    diagram:
        type: grid
        nodes: "[[TERM:*]]"
        properties:
            -   TYPE
        config:
            size-node-width-max: 440
            grid-columns-max: 4
    children:
        -   kind: TERM
            name: "[A-Z][A-Za-z0-9-]*( [A-Z][A-Za-z0-9-]*)*"
            desc: >
                A single domain term, named with its canonical, preferred form (each word
                capitalized, as it should appear in all artifacts) and defined in a concise (1-3
                sentence) paragraph in business language, independent of any implementation,
                referencing other terms by their name where helpful.

                The definition is intensional (ISO 704): it opens with the superordinate concept
                (the `BROADER` term where one exists) and adds the characteristics delimiting the
                term from its siblings (e.g. `A Message submitted by an Attendee as ...`), so that
                the hierarchy and the definitions cross-check each other.
            format:
                maxTableColumns: 5
            referenced:
                -   "[[*]]"
            diagram:
                type: hub
                center: self
                nodes: "[[TERM:*]], [[PREMISE:*]], [[RULE:*]], [[DM.ENTITY:*]], [[ROLE:*]], [[PERSONA:*]]"
                labeled: true
                qualified: true
                config:
                    size-node-width-max: 440
                    size-node-height-scale: 1.75
            props:
                -   name: TYPE
                    desc: >
                        The kind of concept the term denotes: `Entity` (a thing of the domain,
                        usually materialized by a DATA-MODEL entity), `Actor` (a party acting in
                        the domain, be it a human role or an external system, usually played as a
                        ROLE of the User Personas), or `Activity` (a process or procedure of the
                        domain).
                    value: enum(Entity,Actor,Activity)
                -   name: SYNONYMS
                    desc: >
                        Comma-separated list of alternative names or abbreviations that refer to the
                        same term but are *not* the preferred form; a synonym is unambiguous within
                        the Domain Glossary, so a shorthand shared by several terms (the ambiguity a
                        `DISTINCT-FROM` marks) is not a synonym of any of them.
                    optional: true
                -   name: BROADER
                    desc: >
                        Reference to the GLOSSARY term this term is a kind of (or a part of), so
                        that the terms form a hierarchy in which a rule governing the broader term
                        covers the narrower ones, too; at most one broader term, keeping the
                        hierarchy a tree.
                    value: "[[TERM:*]]"
                    optional: true
                    acyclic: true
                -   name: DISTINCT-FROM
                    desc: >
                        Comma-separated references to the GLOSSARY terms easily confused with this
                        one but deliberately *not* synonymous, listed on both terms of each pair,
                        with the distinction stated in the definitions.
                    value: list([[TERM:*]])
                    optional: true
                    symmetric: true
                -   name: PREMISES
                    desc: >
                        Comma-separated references to the SOLUTION-PREMISES objects about the
                        term, i.e. the assumptions, dependencies, and risks concerning the thing
                        or party it denotes (e.g. the dependency on the external system an
                        `Actor` term names), anchoring every premise in the ubiquitous language.
                    value: list([[PREMISE:*]])
                    optional: true

-   kind: REQS
    name: User Personas
    id: UP
    file: 04-REQS-UP-User-Personas.md
    desc: >
        The roles the parties play towards the solution and the *archetypal* user profiles
        embodying them: a role names the part played (by a human or by an external system) and
        is the actor of the Use Cases and the Domain Workflows and the unit in which the
        Authorization Model grants rights, while a persona represents a distinct user group
        holding one or more roles, capturing its goals, needs, behaviors, and context,
        complemented by the non-user stakeholders whose interests the solution has to serve.
    optional: true
    refs: >
        -   Cockburn: Writing Effective Use Cases (2001),
            https://www.informit.com/store/writing-effective-use-cases-9780201702255
        -   Cooper: The Inmates Are Running the Asylum, 2nd ed. (2004),
            https://www.informit.com/store/inmates-are-running-the-asylum-why-high-tech-products-9780672326141
        -   Cooper et al.: About Face: The Essentials of Interaction Design, 4th ed. (2014),
            https://www.wiley.com/en-gb/About+Face:+The+Essentials+of+Interaction+Design,+4th+Edition-p-9781118766576
        -   Pruitt/Adlin: The Persona Lifecycle: Keeping People in Mind Throughout Product Design (2006),
            https://www.sciencedirect.com/book/9780125662512/the-persona-lifecycle
    diagram:
        type: graph
        nodes: "[[ROLE:*]], [[PERSONA:*]]"
        labeled: true
        qualified: true
        config:
            size-node-width-max: 440
    children:
        -   kind: ROLE
            desc: >
                A single role, named with the canonical name of the part a party plays towards
                the solution (e.g. `Moderator`, matching its GLOSSARY term of type `Actor`) and
                described in a concise (1-2 sentence) paragraph by the responsibility the role
                carries, plus a 1-sentence rationale ("why") stating why the part is cut this way.
                A role is the name of a part and not of a person: the personas embodying it act in
                exactly this part and hold exactly the rights the Authorization Model grants to it
                (plus those of the roles it `INHERITS`), while a persona holding several roles
                holds the union of them.
            format:
                maxTableColumns: 5
            referenced:
                -   "[[*]]"
            diagram:
                type: hub
                center: self
                nodes: "[[ROLE:*]], [[TERM:*]], [[PERSONA:*]], [[ACTIVITY:*]], [[USE-CASE:*]],
                    [[CV.ENTITY:*]]"
                labeled: true
                qualified: true
                config:
                    size-node-width-max: 440
                    size-node-height-scale: 1.75
            props:
                -   name: TYPE
                    desc: >
                        Whether the role is played by a `Person`, i.e. a human part embodied by at
                        least one persona, or by a `System`, i.e. an external system acting towards
                        the solution (e.g. a registration system calling the machine-facing
                        interface), which no persona embodies.
                    value: enum(Person,System)
                -   name: TERM
                    desc: >
                        Reference to the GLOSSARY term of type `Actor` the role plays, anchoring
                        the role in the ubiquitous language.
                    value: "[[TERM:*]]"
                    optional: true
                -   name: INHERITS
                    desc: >
                        Comma-separated references to the other ROLE objects this role holds in
                        addition to its own (a role hierarchy, e.g. a manager inheriting the
                        rights of a moderator), where an inherited permission is not restated in
                        the Authorization Model.
                    value: list([[ROLE:*]])
                    optional: true
                    acyclic: true
        -   kind: PERSONA
            desc: >
                An archetypal user profile, named with a per-artifact unique first name of the
                fictional person and carrying a short, bold first-person quote -- written in the
                persona's own voice, like a "tagline", "mantra", or "defining statement" -- that
                captures their core attitude, motivation, frustration, or need in a single memorable
                line. Non-user stakeholders are modeled as personas of type `Stakeholder`.
            format:
                maxTableColumns: 5
            props:
                -   name: TYPE
                    desc: >
                        Whether the persona is a `User` of the solution, i.e. an archetype of the
                        people directly interacting with it, or a `Stakeholder`, i.e. a party
                        with a legitimate interest in the solution but without (or beyond) its
                        direct use -- like a sponsor, regulator, auditor, or operations team --
                        whose goals and frustrations shape the requirements and constraints, but
                        whose "quote" reflects an institutional rather than a personal voice;
                        defaults to `User`.
                    value: enum(User,Stakeholder)
                    optional: true
                -   name: GENDER
                    desc: >
                        The gender of the persona: `male`, `female`, or `diverse`.
                    value: enum(male,female,diverse)
                    optional: true
                -   name: AGE
                    desc: >
                        The age in years of the persona.
                    value: /^[0-9]+$/
                    optional: true
                -   name: ROLES
                    desc: >
                        Comma-separated references to the ROLE objects the persona embodies, i.e.
                        the parts it plays towards the solution and hence the rights it acts with,
                        so that every `User` persona holds at least one role; omitted for a
                        `Stakeholder` persona playing no part towards the solution itself.
                    value: list([[ROLE:*]])
                    optional: true
                -   name: TERMS
                    desc: >
                        Comma-separated references to the GLOSSARY terms the persona embodies, i.e.
                        the domain roles it acts in and the domain concepts it primarily deals
                        with, so that every persona is anchored in the ubiquitous language.
                    value: list([[TERM:*]])
                    optional: true
                -   name: PROFICIENCY
                    desc: >
                        The technical and domain skill level of the persona: `novice`,
                        `intermediate`, or `expert`.
                    value: enum(novice,intermediate,expert)
                    optional: true
                -   name: GOAL
                    desc: >
                        What the persona wants to achieve with the solution overall, stated as one
                        or more concise goals.
                -   name: FRUSTRATION
                    desc: >
                        The status-quo pains and unmet needs motivating the persona, stated
                        independently of the per-step pain points of the User Journey, which
                        record the friction within the target journey instead.
                    optional: true
                -   name: PREMISES
                    desc: >
                        Comma-separated references to the SOLUTION-PREMISES objects the persona
                        (usually a `Stakeholder`) vouches for, i.e. whose assumption it confirms,
                        whose dependency agreement it holds, or whose risk mitigation it owns;
                        omitted when the persona is accountable for no premise.
                    value: list([[PREMISE:*]])
                    optional: true

-   kind: REQS
    name: User Journey
    id: UJ
    file: 05-REQS-UJ-User-Journey.md
    desc: >
        The end-to-end experience a user has while discovering, adopting, and using the solution,
        mapping their steps, touchpoints, and emotions over time. The journey is the *target*
        journey with the solution in place, so the friction it records is what the solution has
        to mitigate, not the status quo it replaces.
    optional: true
    refs: >
        -   NN/g: Journey Mapping 101 (2018),
            https://www.nngroup.com/articles/journey-mapping-101/
        -   Kalbach: Mapping Experiences, 2nd ed. (2020),
            https://www.oreilly.com/library/view/mapping-experiences-2nd/9781492076629/
        -   Stickdorn et al.: This Is Service Design Doing (2018),
            https://www.thisisservicedesigndoing.com/
    diagram:
        type: grid
        nodes: "[[JOURNEY:*]]"
        properties:
            -   ACTORS
    children:
        -   kind: JOURNEY
            desc: >
                The end-to-end journey of a single persona (or of multiple personas sharing the same
                experience as role variants), named with a 2-5 word summary of the pursued scenario.
            props:
                -   name: ACTORS
                    desc: >
                        Comma-separated references to the User Personas objects experiencing the
                        journey.
                    value: list([[PERSONA:*]])
            children:
                -   kind: STEP
                    desc: >
                        A single step of the journey, named with a 5-10 word summary of the step at
                        its touchpoint.
                    props:
                        -   name: STAGE
                            desc: >
                                The journey stage the step belongs to: `Awareness` (the actor is not
                                aware of the solution, but has a need), `Consideration` (the actor
                                is aware of the solution and considers its use), `Decision` (the
                                actor wants to pick the solution), `Onboarding` (the actor starts
                                using the solution for the first time), `Usage` (the actor performs
                                the recurring core activity the solution is for), `Retention` (the
                                actor returns, renews, or extends use over the long term), or
                                `Advocacy` (the actor is a fan of the solution and tells others).
                            value: enum(Awareness,Consideration,Decision,Onboarding,Usage,Retention,Advocacy)
                        -   name: GOAL
                            desc: What the actor wants to achieve at this step.
                        -   name: TOUCHPOINT
                            desc: >
                                Where or how the interaction happens (e.g. landing page, email,
                                support call).
                        -   name: ACTION
                            desc: What the actor actually does at this step.
                        -   name: EMOTION
                            desc: >
                                The felt state of the actor at this step, given as a word plus its
                                valence on a signed 5-point Likert scale from `-2` (very negative)
                                over `0` (neutral) to `+2` (very positive), so that the emotion
                                curve of the journey can be derived (e.g. `Curious (+1)`).
                            value: /^.+ \((-[12]|0|\+[12])\)$/
                        -   name: PAIN-POINT
                            desc: >
                                The friction or frustration the actor encounters at this step,
                                i.e. what the solution has to mitigate here.
                            optional: true
                        -   name: OPPORTUNITY
                            desc: >
                                The improvement the solution delivers (or should deliver) at this
                                step, mitigating the pain point or reinforcing the positive emotion,
                                and serving as the seed of Functional Requirements.
                            optional: true

-   kind: REQS
    name: Functional Requirements
    id: FR
    file: 06-REQS-FR-Functional-Requirements.md
    desc: >
        The concrete behaviors and capabilities the solution must provide, describing *what* the
        system does in terms of functions, features, and operations, while the quality bounds and
        constraints on them belong to the Non-Functional Requirements.
    optional: true
    refs: >
        -   Mavin et al.: Easy Approach to Requirements Syntax (EARS) (2009),
            https://ieeexplore.ieee.org/document/5328509
        -   ISO/IEC/IEEE 29148:2018: Systems and software engineering -- Life cycle processes -- Requirements engineering (2018),
            https://www.iso.org/standard/72089.html
        -   DSDM: MoSCoW Prioritisation, DSDM Agile Project Framework (2014),
            https://www.agilebusiness.org/dsdm-project-framework/moscow-prioritisation.html
    diagram:
        type: grid
        nodes: "[[FR.REQUIREMENT:*]]"
        properties:
            -   PRIORITY
        config:
            size-node-width-max: 440
            grid-columns-max: 5
    children:
        -   kind: REQUIREMENT
            desc: >
                A single functional requirement, named with a short (3-8 word) summary and described
                in a concise (1-3 sentence) paragraph as *what* the solution must do, stating
                exactly one obligation (split into several requirements otherwise) as an observable
                behavior a test case can verify, written with exactly one keyword `MUST`, `SHOULD`,
                or `COULD` matching its `PRIORITY`, plus a 1-sentence rationale ("why").

                The statement follows one of the EARS patterns: ubiquitous (`The system MUST ...`),
                event-driven (`When <trigger>, the system MUST ...`), state-driven (`While <state>,
                the system MUST ...`), optional-feature (`Where <feature>, the system MUST ...`), or
                unwanted-behavior (`If <condition>, then the system MUST ...`).
            format:
                maxTableColumns: 6
            referenced:
                -   "[[USE-CASE:*]]"
            props:
                -   name: PRIORITY
                    desc: >
                        The MoSCoW priority of the requirement: `MUST`, `SHOULD`, `COULD`, or
                        `WONT`, matching the keyword of the statement. The `WONT` priority records
                        a requirement deliberately excluded from the current scope ("won't have this
                        time"), preserving the conscious decision rather than silently dropping it,
                        with the statement still phrased as it would be if in scope.
                    value: enum(MUST,SHOULD,COULD,WONT)
                -   name: PREMISES
                    desc: >
                        Comma-separated references to the SOLUTION-PREMISES objects the
                        requirement rests on, i.e. the assumptions, dependencies, and risks whose
                        failure calls for revisiting it.
                    value: list([[PREMISE:*]])
                    optional: true

-   kind: REQS
    name: Non-Functional Requirements
    id: NR
    file: 07-REQS-NR-Non-Functional-Requirements.md
    desc: >
        The quality attributes and constraints the solution must satisfy, such as performance,
        security, scalability, reliability, and usability.
    optional: true
    refs: >
        -   ISO/IEC 25010:2023: Systems and software engineering -- Systems and software Quality Requirements and Evaluation (SQuaRE) -- Product quality model (2023),
            https://www.iso.org/standard/78176.html
        -   ISO/IEC/IEEE 29148:2018: Systems and software engineering -- Life cycle processes -- Requirements engineering (2018),
            https://www.iso.org/standard/72089.html
        -   DSDM: MoSCoW Prioritisation, DSDM Agile Project Framework (2014),
            https://www.agilebusiness.org/dsdm-project-framework/moscow-prioritisation.html
        -   Doran: There's a S.M.A.R.T. Way to Write Management's Goals and Objectives, Management Review 70(11) (1981)
    diagram:
        type: grid
        nodes: "[[NR.REQUIREMENT:*]]"
        properties:
            -   PRIORITY
            -   CATEGORY
        config:
            size-node-width-max: 440
            grid-columns-max: 5
    children:
        -   kind: REQUIREMENT
            desc: >
                A single non-functional requirement, named with a short (3-8 word) summary and
                described in a concise (1-3 sentence) paragraph as the quality attribute or
                constraint the solution must satisfy, stating exactly one obligation (split into
                several requirements otherwise) which is verifiable against its `METRIC`, written
                with exactly one keyword `MUST`, `SHOULD`, or `COULD` matching its `PRIORITY`, plus
                a 1-sentence rationale ("why").
            props:
                -   name: PRIORITY
                    desc: >
                        The MoSCoW priority of the requirement: `MUST`, `SHOULD`, `COULD`, or
                        `WONT`, matching the keyword of the statement. The `WONT` priority records
                        a requirement deliberately excluded from the current scope ("won't have this
                        time"), preserving the conscious decision rather than silently dropping it,
                        with the statement still phrased as it would be if in scope.
                    value: enum(MUST,SHOULD,COULD,WONT)
                -   name: CATEGORY
                    desc: >
                        The category of the requirement: the quality attribute it addresses,
                        according to the top-level characteristics of the ISO/IEC 25010:2023
                        Software-Quality Model (except for `Functional Suitability`, which is
                        covered by the Functional Requirements instead, and with `Usability` kept
                        as the name of `Interaction Capability`), plus the two non-quality
                        categories `Compliance` (a legal or regulatory obligation) and `Constraint`
                        (a technical, business, or environmental constraint on the *solution*,
                        e.g. a hosting, budget, or technology mandate, as opposed to a constraint
                        on the domain, which is a Domain Rule).
                    value: enum(Performance,Compatibility,Usability,Reliability,Security,Safety,Maintainability,Flexibility,Compliance,Constraint)
                -   name: QUALIFIES
                    desc: >
                        Comma-separated references to the FUNCTIONAL-REQUIREMENTS objects whose
                        capability the requirement bounds or constrains.
                    value: list([[FR.*]])
                    optional: true
                -   name: PREMISES
                    desc: >
                        Comma-separated references to the SOLUTION-PREMISES objects the
                        requirement rests on, i.e. the assumptions, dependencies, and risks whose
                        failure calls for revisiting it.
                    value: list([[PREMISE:*]])
                    optional: true
                -   name: METRIC
                    desc: >
                        The threshold or target by which the requirement is judged satisfied,
                        stated as a scale plus a target value according to the SMART principle
                        (*specific*, *measurable*, *achievable*, *relevant*, and *time-bound*),
                        e.g. `p95 latency < 200 ms` or `uptime >= 99.9 % per month`.

-   kind: REQS
    name: Domain Rules
    id: DR
    file: 08-REQS-DR-Domain-Rules.md
    desc: >
        The domain invariants, policies, and decision logic that must always hold true in the
        problem domain, independent of any single feature, constraining the Functional and
        Non-Functional Requirements.
    optional: true
    refs: >
        -   Hay/Healy: Defining Business Rules ~ What Are They Really? (2000),
            https://www.businessrulesgroup.org/first_paper/br01c0.htm
        -   BRG: Business Rules Manifesto (2003),
            https://www.businessrulesgroup.org/brmanifesto.htm
        -   OMG DMN 1.5: Decision Model and Notation (2024),
            https://www.omg.org/spec/DMN/
    diagram:
        type: grid
        nodes: "[[RULE:*]]"
        properties:
            -   CATEGORY
            -   SOURCE
        config:
            size-node-width-max: 440
            grid-columns-max: 5
    children:
        -   kind: RULE
            desc: >
                A single domain rule, named with a short (3-8 word) summary and described in a
                concise (1-3 sentence) paragraph stating the rule declaratively as a condition that
                must hold, written with the keyword `MUST` or `MUST NOT` (`SHOULD` or `SHOULD NOT`
                for a `Policy` only, as a `SHOULD` on any other kind contradicts its "must always
                hold" nature) to indicate the obligation level and naming the domain terms it
                governs (as defined in the Domain Glossary and listed in `GOVERNS`), plus a 1-sentence
                rationale ("why"). A permission (`MAY`) is not a rule: state the obligation which
                bounds the permitted choice instead (e.g. `MUST use only ...` rather than
                `MAY use ...`).

                The subject of the statement is a domain term, never the system: a rule holds in
                the problem domain even if the solution were replaced, so if the sentence needs
                `The system` as its subject, it is a Functional Requirement, not a rule.

                A rule whose outcome depends on more than two conditions is stated as a decision
                list instead of prose, in the manner of a DMN decision table: a lead sentence
                naming the governed term and the obligation, an ordered list with one `<condition>:
                <outcome>` item per case, applied in order with the first matching case winning,
                and a closing sentence stating the outcome of the remaining cases ("otherwise")
                and carrying the rationale.
            format:
                maxTableColumns: 5
            referenced:
                -   "[[TEST-CASE:*]]"
            props:
                -   name: CATEGORY
                    desc: >
                        The kind of rule: `Constraint` (a structural condition that must always
                        hold, limiting the allowed *domain* states, values, or actions, as opposed
                        to a constraint on the solution, which is a Non-Functional Requirement),
                        `Derivation` (a value computed or a fact inferred from others), `Action`
                        (an obligation triggered by a domain event, stated as `When <trigger>,
                        <term> MUST ...` and told apart from an event-driven Functional Requirement
                        by its domain subject alone), or `Policy` (a deliberate business guideline
                        stated with `SHOULD`/`SHOULD NOT`, which may be deviated from with
                        justification, whereas the other kinds are stated with `MUST`/`MUST NOT`
                        and cannot).
                    value: enum(Constraint,Derivation,Action,Policy)
                -   name: SOURCE
                    desc: >
                        The authority the rule originates from, determining who can change it:
                        `Law` (a statutory or regulatory obligation, changeable by the legislator
                        only), `Contract` (an agreement with a customer, partner, or supplier,
                        changeable by renegotiation only), `Standard` (an industry norm or
                        standard, deviated from with justification only), `Business` (a deliberate
                        decision of the organization, changeable by its owner), or `Domain` (an
                        inherent truth of the problem domain, not changeable without redefining
                        the domain). The concrete authority (e.g. `GDPR Art. 17`) is named in the
                        rationale of the rule.
                    value: enum(Law,Contract,Standard,Business,Domain)
                    optional: true
                -   name: GOVERNS
                    desc: >
                        Comma-separated references to the GLOSSARY terms the rule governs, i.e.
                        the domain terms its statement is about, so that every rule is anchored in
                        the ubiquitous language and every term shows the rules that hold for it.
                    value: list([[TERM:*]])
                    optional: true
                -   name: CONSTRAINS
                    desc: >
                        Comma-separated references to the FUNCTIONAL-REQUIREMENTS or
                        NON-FUNCTIONAL-REQUIREMENTS objects the rule constrains.
                    value: list([[FR.*]], [[NR.*]])
                    optional: true
                -   name: PREMISES
                    desc: >
                        Comma-separated references to the SOLUTION-PREMISES objects the rule
                        rests on, i.e. the assumptions, dependencies, and risks whose failure
                        calls for revisiting it.
                    value: list([[PREMISE:*]])
                    optional: true

-   kind: REQS
    name: Domain Workflows
    id: DW
    file: 09-REQS-DW-Domain-Workflows.md
    desc: >
        The cross-actor, multi-sitting workflows of the domain (also known as business
        processes) the solution takes part in, each an ordered set of activities connected by
        handoffs between the acting parties, making the collaboration across roles and over time
        explicit, which neither the User Journey (the experience of a single persona) nor the
        Use Cases (the goal of a single actor in one sitting) capture. The artifact is absent for
        a tool-like solution without any workflow spanning several actors or sittings.
    optional: true
    refs: >
        -   OMG: Business Process Model and Notation (BPMN) 2.0.2 (2013),
            https://www.omg.org/spec/BPMN/2.0.2
        -   Dumas/La Rosa/Mendling/Reijers: Fundamentals of Business Process Management, 2nd ed. (2018),
            https://link.springer.com/book/10.1007/978-3-662-56509-4
        -   van der Aalst: Process Mining: Data Science in Action, 2nd ed. (2016),
            https://link.springer.com/book/10.1007/978-3-662-49851-4
    diagram:
        type: grid
        nodes: "[[WORKFLOW:*]]"
        properties:
            -   ACTORS
        config:
            size-node-width-max: 440
            size-node-height-scale: 2
            grid-columns-max: 4
    children:
        -   kind: WORKFLOW
            desc: >
                A single workflow, named with a short (2-5 word) summary phrased as the outcome
                pursued (e.g. `Run Broadcast Event`) and described in a concise (1-3 sentence)
                paragraph at a glance, plus a 1-sentence rationale ("why") stating the value the
                organization gains. A workflow is a flat control flow of `ACTIVITY`
                objects (the work done by one party at a time) connected by `HANDOFF` objects (the
                passing of control from one activity to the next): exactly one initial activity,
                at least one final activity, every activity reachable from the initial one, and
                some final activity reachable from every activity, while a handoff back to an
                earlier activity (a rework loop) is permitted.

                The workflow is at summary level, above the user-goal level of the Use Cases: it
                spans several actors and several sittings, and its activities leave the
                step-by-step interaction with the solution to the use cases referencing them.
                An activity and a use case relate n:m -- an activity is covered by several use
                cases, a use case spans several activities, and an activity performed outside the
                solution is covered by none at all -- so the workflow is no mere sequence of use
                cases and cannot be assembled from them.
            automaton:
                nodes: ACTIVITY
                edges: HANDOFF
                source: FROM
                target: TO
                initial: INITIAL
                final: FINAL
            diagram:
                type: graph
                edges: "[[HANDOFF:*]]"
                edgeSource: FROM
                edgeTarget: TO
                onlyConnected: true
                properties:
                    -   ACTOR
                config:
                    size-node-width-max: 440
            props:
                -   name: ACTORS
                    desc: >
                        Comma-separated references to the User Personas ROLE objects taking part
                        in the workflow, in the order of their first appearance, so that every
                        `ACTOR` of an activity is listed here.
                    value: list([[ROLE:*]])
                -   name: OWNER
                    desc: >
                        Reference to the User Personas object (usually a `Stakeholder`) accountable
                        for the workflow as a whole, i.e. for its outcome and its rules, as opposed
                        to the actors performing its activities.
                    value: "[[PERSONA:*]]"
                    optional: true
                -   name: TRIGGER
                    desc: >
                        The event that starts the workflow, stated as a 1-sentence
                        occurrence (e.g. `A manager decides to hold a broadcast event.`).
                -   name: OUTCOME
                    desc: >
                        The result that holds once the workflow has reached a final
                        activity (e.g. `The event took place and its results are archived.`).
                -   name: JOURNEYS
                    desc: >
                        Comma-separated references to the User Journey objects the workflow spans,
                        i.e. the per-persona experiences of which the workflow is the cross-persona
                        counterpart.
                    value: list([[JOURNEY:*]])
                    optional: true
                -   name: TERMS
                    desc: >
                        Comma-separated references to the GLOSSARY terms of type `Activity` the
                        workflow realizes, anchoring it in the ubiquitous language.
                    value: list([[TERM:*]])
                    optional: true
                -   name: RULES
                    desc: >
                        Comma-separated references to the DOMAIN-RULES objects governing the
                        workflow as a whole (e.g. a deadline or an approval policy), while a rule
                        checked at a single handoff is referenced from the handoff instead.
                    value: list([[RULE:*]])
                    optional: true
            children:
                -   kind: ACTIVITY
                    desc: >
                        A single unit of work within the workflow, performed by one party without a
                        handoff in between, named with a short (2-5 word) verb phrase (e.g. `Invite
                        Attendees`) and described by a 1-2 sentence description of what is done and
                        what it yields. Every activity used in a handoff *MUST* be declared, every
                        activity *MUST* be reachable from the initial one, and every activity with
                        no outgoing handoff *MUST* be final.
                    format:
                        maxTableColumns: 5
                    props:
                        -   name: ACTOR
                            desc: >
                                Reference to the User Personas ROLE object performing the activity,
                                or `System` for an activity the solution performs on its own (e.g.
                                sending the invitations) or `Time` for a waiting period ending with
                                a deadline; several parties are given only for an activity they
                                perform jointly, as a change of the acting party is a handoff.
                            value: list([[ROLE:*]], enum(System,Time))
                        -   name: INITIAL
                            desc: >
                                Whether the activity is the initial one, i.e. the single activity
                                the `TRIGGER` of the workflow starts (exactly one per workflow).
                            value: /^(?:true|false)$/
                            unique: enum(true)
                            present: enum(true)
                            optional: true
                        -   name: FINAL
                            desc: >
                                Whether the activity is a final one, i.e. one in which the workflow
                                may legally end with its `OUTCOME` (at least one per workflow).
                            value: /^(?:true|false)$/
                            present: enum(true)
                            optional: true
                -   kind: HANDOFF
                    name: "[a-z][a-z-]*"
                    desc: >
                        A single passing of control from one activity to the next, named with a
                        short, lower-cased verb of the completing event (e.g. `approve`, `publish`)
                        and described by a 1-sentence description of what is passed on
                        (information, artifact, or notification) and how the receiving party learns
                        about it. Several handoffs departing from the same activity form a decision
                        (told apart by their `CONDITION`) or a parallel split, several arriving at
                        the same activity a merge, and a handoff back to an earlier activity a
                        rework loop.
                    format:
                        maxTableColumns: 6
                    props:
                        -   name: FROM
                            desc: The activity (of the same workflow) the handoff departs from.
                            value: "[[ACTIVITY:*]]"
                            local: true
                        -   name: TO
                            desc: The activity (of the same workflow) the handoff arrives at.
                            value: "[[ACTIVITY:*]]"
                            local: true
                        -   name: CONDITION
                            desc: >
                                The condition under which the handoff is taken when several
                                handoffs depart from the same activity, stated as a 1-sentence
                                statement of what has to hold (e.g. `The rehearsal revealed
                                defects.`); omitted for an unconditional handoff.
                            optional: true
                        -   name: RULES
                            desc: >
                                Comma-separated references to the DOMAIN-RULES objects the
                                handoff enforces, usually through its `CONDITION`.
                            value: list([[RULE:*]])
                            optional: true

-   kind: REQS
    name: Use Cases
    id: UC
    file: 10-REQS-UC-Use-Cases.md
    desc: >
        The discrete goals users pursue with the solution, each describing an actor's interaction to
        achieve a specific outcome, together with the concrete step-by-step flows for main,
        alternative, and exceptional paths.
    optional: true
    refs: >
        -   Cockburn: Writing Effective Use Cases (2001),
            https://www.informit.com/store/writing-effective-use-cases-9780201702255
        -   Jacobson et al.: Object-Oriented Software Engineering: A Use Case Driven Approach (1992),
            https://www.informit.com/store/object-oriented-software-engineering-a-use-case-driven-9780201544350
        -   Jacobson/Spence/Bittner: Use-Case 2.0: The Guide to Succeeding with Use Cases (2011),
            https://www.ivarjacobson.com/publications/white-papers/use-case-20-e-book
    diagram:
        type: graph
        nodes: "[[USE-CASE:*]], [[ROLE:*]]"
        labeled: true
        qualified: true
        onlyConnected: true
        config:
            size-node-width-max: 440
    children:
        -   kind: USE-CASE
            desc: >
                A discrete goal a user pursues with the solution, named with a short (3-8 word)
                summary phrased as an actor goal (e.g. `Reset Forgotten Password`) and described in
                a concise (1-3 sentence) paragraph at a glance, plus a 1-sentence rationale ("why")
                stating the value the actor gains, without prescribing the step-by-step flow, which
                belongs to its `SCENARIO` objects: exactly one `Main` scenario, listed first,
                followed by any number of `Alternative` and `Exceptional` scenarios.

                The use case is at user-goal level: a goal the actor completes in one sitting,
                neither a summary of many sittings and actors (which belongs to a Domain Workflow
                as a whole, or to a User Journey when seen by a single persona) nor a single
                interaction (which belongs to a scenario as one of its steps). Its `ACTIVITIES`
                relate it n:m to the Domain Workflow activities -- a use case spans several
                activities and an activity is covered by several use cases -- so the two decompose
                the same domain independently instead of nesting into each other.
            diagram:
                type: hub
                center: self
                nodes: "[[USE-CASE:*]], [[ROLE:*]], [[PERSONA:*]], [[STEP:*]], [[ACTIVITY:*]],
                    [[FR.REQUIREMENT:*]], [[RULE:*]], [[TRANSITION:*]]"
                labeled: true
                qualified: true
                config:
                    size-node-width-max: 440
                    size-node-height-scale: 1.75
            props:
                -   name: ACTOR
                    desc: >
                        Reference to the User Personas ROLE object denoting the primary actor
                        pursuing the goal, i.e. the part played and not the person playing it, so
                        that a use case is written once per role and not once per persona.
                    value: "[[ROLE:*]]"
                -   name: PERSONAS
                    desc: >
                        Comma-separated references to the User Personas objects taking the
                        `ACTOR` role in this use case, i.e. the archetypes for which its flow is
                        worked out in the Dialog Storyboard and the Test Cases; omitted when every
                        persona holding the role pursues the goal alike.
                    value: list([[PERSONA:*]])
                    optional: true
                -   name: JOURNEYS
                    desc: >
                        Comma-separated references to the User Journey STEP objects the use case
                        covers, tracing the journey into the use cases.
                    value: list([[STEP:*]])
                    optional: true
                -   name: ACTIVITIES
                    desc: >
                        Comma-separated references to the Domain Workflow ACTIVITY objects within
                        which the actor performs the use case, tracing the workflow into the use
                        cases; omitted for a use case outside any workflow.
                    value: list([[ACTIVITY:*]])
                    optional: true
                -   name: REQUIREMENTS
                    desc: >
                        Comma-separated references to the FUNCTIONAL-REQUIREMENTS objects the use
                        case exercises, i.e. whose behavior its scenarios walk through, so that every
                        Functional Requirement is exercised by at least one use case.
                    value: list([[FR.*]])
                    optional: true
                -   name: RULES
                    desc: >
                        Comma-separated references to the DOMAIN-RULES objects the scenarios of
                        the use case apply, i.e. whose condition a scenario step checks or enforces
                        (e.g. an access rule in an authentication step).
                    value: list([[RULE:*]])
                    optional: true
                -   name: INCLUDES
                    desc: >
                        Comma-separated references to the other USE-CASES objects this use case
                        includes as sub-flows, i.e. whose entire flow one of its scenario steps
                        invokes (e.g. `The attendee authenticates ([[USE-CASE:authenticate]]).`),
                        factoring a flow shared by several use cases out into a use case of its own
                        instead of restating its steps.
                    value: list([[USE-CASE:*]])
                    optional: true
                    acyclic: true
                -   name: PRE-CONDITION
                    desc: >
                        The condition that must hold before the use case can begin.
                    optional: true
                -   name: TRIGGER
                    desc: >
                        The event that starts the use case, stated as a 1-sentence occurrence (e.g.
                        `The attendee opens the event URL.`), as opposed to the `PRE-CONDITION`
                        which is a state that has to hold, and matching the `When <trigger>` of the
                        event-driven Functional Requirements the use case exercises.
                    optional: true
                -   name: POST-CONDITION
                    desc: >
                        The condition that holds after the use case completes successfully.
                    optional: true
            children:
                -   kind: SCENARIO
                    desc: >
                        A concrete step-by-step flow of the use case, named with a short (3-8 word)
                        summary and comprised of sequentially numbered, imperative steps, each
                        naming the acting party (actor or system) and the action taken (e.g. `The
                        user submits their credentials.`). The steps describe the intent and the
                        information exchanged between actor and system, not the user interface
                        (dialogs, screens, buttons, and the like), which belongs to the Dialog
                        Patterns and the Dialog Storyboard instead.
                    props:
                        -   name: TYPE
                            desc: >
                                The path the scenario represents: `Main` (the primary, happy-path
                                flow, exactly one per use case), `Alternative` (a valid but
                                secondary flow), or `Exceptional` (an error or failure-handling
                                flow).
                            value: enum(Main,Alternative,Exceptional)
                            unique: enum(Main)
                            present: enum(Main)
                        -   name: RESULT
                            desc: >
                                How an `Alternative` or `Exceptional` scenario ends: `Success` (the
                                goal is reached, possibly in an end state differing from the `Main`
                                scenario), `Failure` (the goal is abandoned), or `Resume` (the flow
                                returns to the `Main` scenario at the step named in the `OUTCOME`),
                                omitted on the `Main` scenario, which ends in the `POST-CONDITION`
                                of the use case.
                            value: enum(Success,Failure,Resume)
                            optional: true
                        -   name: AT-MAIN-STEP
                            desc: >
                                The number of the step of the `Main` scenario at which an
                                `Alternative` or `Exceptional` scenario branches off: the scenario
                                shares the preceding steps of the `Main` scenario instead of
                                restating them, and its own steps, numbered from this number on,
                                replace the remaining ones (not applicable to the `Main` scenario
                                itself).
                            value: /^[1-9][0-9]*$/
                            optional: true
                        -   name: OUTCOME
                            desc: >
                                The condition that holds when an `Alternative` or `Exceptional`
                                scenario ends, stated like a post-condition and replacing the
                                `POST-CONDITION` of the use case for this scenario (naming the
                                `Main` step at which the flow continues in case of `Resume`),
                                omitted on the `Main` scenario.
                            optional: true

