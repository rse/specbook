#   This is the "Standard" SpecBook schema.
#
#   Modeling Purpose
#   ----------------
#
#   This schema allows specifying a large variety of documents for the
#   precise specification of solutions, systems and software.
#
#   Modeling Coverage
#   -----------------
#
#   | "Standard" SpecBook Object        | PRD | StRS | SyRS | SRS | UIS | UISG | TCS | AD  |
#   | --------------------------------- | --- | ---- | ---- | --- | --- | ---- | --- | --- |
#   | META: Title                       |     |      |      |     |     |      |     |     |
#   | --------------------------------- | --- | ---- | ---- | --- | --- | ---- | --- | --- |
#   | REQS: Solution Vision             |  X  |  X   |      |     |     |      |     |     |
#   | REQS: Solution Premises           |  X  |  X   |  X   |  X  |     |      |     |     |
#   | REQS: Domain Glossary             |  X  |  X   |  X   |  X  |     |      |     |     |
#   | REQS: User Personas               |  X  |  X   |  X   |  X  |  X  |      |     |     |
#   | REQS: User Journey                |  X  |  X   |      |     |  X  |      |     |     |
#   | REQS: Functional Requirements     |  X  |  X   |  X   |  X  |     |      |     |     |
#   | REQS: Non-Functional Requirements |  X  |  X   |  X   |  X  |  X  |      |     |     |
#   | REQS: Domain Rules                |     |  X   |  X   |  X  |     |      |     |     |
#   | REQS: Domain Workflows            |     |  X   |  X   |  X  |     |      |     |     |
#   | REQS: Use Cases                   |     |      |  X   |  X  |  X  |      |     |     |
#   | --------------------------------- | --- | ---- | ---- | --- | --- | ---- | --- | --- |
#   | DATA: Data Model                  |     |      |  X   |  X  |     |      |     |     |
#   | DATA: State Model                 |     |      |  X   |  X  |     |      |     |     |
#   | DATA: Authorization Model         |     |      |  X   |  X  |     |      |     |     |
#   | --------------------------------- | --- | ---- | ---- | --- | --- | ---- | --- | --- |
#   | APIS: Interface Model             |     |      |  X   |  X  |     |      |     |     |
#   | APIS: Interface Datatypes         |     |      |      |  X  |     |      |     |     |
#   | APIS: Interface Endpoints         |     |      |      |  X  |     |      |     |     |
#   | --------------------------------- | --- | ---- | ---- | --- | --- | ---- | --- | --- |
#   | UXUI: Interaction Concept         |     |      |      |     |  X  |  X   |     |     |
#   | UXUI: Language Conventions        |     |      |      |     |  X  |  X   |     |     |
#   | UXUI: Dialog Patterns             |     |      |      |     |  X  |  X   |     |     |
#   | UXUI: Dialog Storyboard           |     |      |      |     |  X  |      |     |     |
#   | UXUI: Visual Design               |     |      |      |     |  X  |  X   |     |     |
#   | --------------------------------- | --- | ---- | ---- | --- | --- | ---- | --- | --- |
#   | ARCH: Context View                |     |      |      |     |     |      |     |  X  |
#   | ARCH: Functionality View          |     |      |      |     |     |      |     |  X  |
#   | ARCH: Concurrency View            |     |      |      |     |     |      |     |  X  |
#   | ARCH: Development View            |     |      |      |     |     |      |     |  X  |
#   | ARCH: Deployment View             |     |      |      |     |     |      |     |  X  |
#   | ARCH: Operations View             |     |      |      |     |     |      |     |  X  |
#   | ARCH: Quality Perspectives        |     |      |      |     |     |      |     |  X  |
#   | ARCH: Technology Stack            |     |      |      |     |     |      |     |  X  |
#   | --------------------------------- | --- | ---- | ---- | --- | --- | ---- | --- | --- |
#   | DECS: Decision Record             |     |      |      |     |     |      |     |  X  |
#   | --------------------------------- | --- | ---- | ---- | --- | --- | ---- | --- | --- |
#   | TEST: Test Cases                  |     |      |      |     |     |      |  X  |     |
#
#   Legend:
#   -   PRD:  Product Requirements Document                      (Cagan 2005)
#   -   StRS: Stakeholder Requirements Specification             (ISO/IEC/IEEE 29148 StRS)
#   -   SyRS: System Requirements Specification                  (ISO/IEC/IEEE 29148 SyRS)
#   -   SRS:  Software Requirements Specification                (ISO/IEC/IEEE 29148 SRS)
#   -   UIS:  Human-Centred Design: User Interface Specification (ISO 9241-210:2019)
#   -   UISG: User Interface Style Guide                         (ISO 9241-110/-112/-125/-161)
#   -   TCS:  Test Case Specification                            (ISO/IEC/IEEE 29119-3:2021)
#   -   AD:   Architecture Description                           (ISO/IEC/IEEE 42010)
#
#   Design Decisions
#   ----------------
#
#   -   All object references are strictly back-references, i.e., later
#       objects reference earlier ones.
#
#   -   The depth of the modeling aspects is at maximum at level 3, which
#       means that all objects stay at level 1 and 2 and level 3 is mainly
#       for properties. This leads to decent headings and a not too deep
#       Table of Contents.
#
#   -   All artifacts are optional, so that the schema can back not only
#       a full specification but also the individual document types of
#       the modeling coverage matrix above on their own.
#
#   -   The traditional hard Software Requirements Specification (SRS)
#       vs. Architecture Description (AD) document split is
#       intentionally smoothed, so we can link from AD to SRS objects
#       and in AI-times (where dedicated teams no longer write
#       those documents separately) the AI should see one coherent
#       specification document, too.
#

-   kind: META
    name: Title
    id:   TI
    file: 00-META-TI-Title.md
    desc: >
        The top-level specification meta information.
        Some of the information is rendered onto the title page.
    optional: true
    diagram:
        type: graph
        nodes: "[[REQS:*]], [[DATA:*]], [[APIS:*]], [[UXUI:*]], [[ARCH:*]], [[DECS:*]], [[TEST:*]]"
        deep: true
        qualified: true
    props:
        -   name: LOGO
            desc: The logo of the specification.
            optional: true
        -   name: TITLE
            desc: The title of the specification.
        -   name: SUBTITLE
            desc: The subtitle of the specification.
            optional: true
        -   name: AUTHOR
            desc: The author of the specification.
            optional: true
        -   name: VERSION
            desc: The version of the specification.
            optional: true
        -   name: LANG
            desc: The language of the specification texts (ISO 639-1 code).
            value: /^[a-z]{2}(-[A-Za-z0-9]+)?$/
            optional: true
        -   name: CHARSET
            desc: The character set the embedded fonts are subsetted to.
            value: enum(US-ASCII,ISO-8859-1,ISO-Latin-1,ISO-8859-15,ISO-Latin-15,UTF-8)
            optional: true
        -   name: PAPER-SIZE
            desc: The paper size the print/PDF rendering is targeted at.
            value: enum(A4,Letter,Legal)
            optional: true
        -   name: THEME-STYLE
            desc: The theme style.
            value: enum(dark,light)
            optional: true
        -   name: THEME-TONE
            desc: The theme color tone.
            value: /^#[0-9a-fA-F]{6}$/
            optional: true

