-   kind: ARCH
    name: Context View
    id: CV
    file: 23-ARCH-CV-Context-View.md
    desc: >
        The relationships, dependencies, and interactions between the solution and its environment,
        defining the system's boundary by enumerating the external entities sitting at it. The
        artifact complements the Solution Vision: its `SCOPE` states what is deliberately *out* of
        the solution, the Context View enumerates what the solution touches *at* the boundary.
    optional: true
    refs: >
        -   Rozanski/Woods: Software Systems Architecture, 2nd ed.: The Context Viewpoint (2011),
            https://www.viewpoints-and-perspectives.info/home/viewpoints/context/
        -   Brown: The C4 Model: System Context Diagram (2018),
            https://c4model.com/diagrams/system-context
        -   ISO/IEC/IEEE 42010:2022: Software, systems and enterprise -- Architecture description (2022),
            https://www.iso.org/standard/74393.html
    diagram:
        type: hub
        nodes: "[[ARCH:CV.ENTITY:*]]"
        center:
            source: "[[META:TI]]"
            property: TITLE
            kind: Solution
        centerEdges:
            property: DIRECTION
            inbound:  Inbound
            outbound: Outbound
            both:     Bidirectional
        qualified: true
        properties:
            -   KIND
    childs:
        -   kind: ENTITY
            desc: >
                A single external entity the solution interacts with, named with a short (2-5 word)
                summary (e.g. `Payment Gateway`, `Identity Provider`, `End User`) and described in a
                concise (1-3 sentence) paragraph by the relationship and dependency between the
                solution and the entity, plus a 1-sentence rationale ("why") for the entity being
                part of the system context.

                An entity is outside the solution and exchanges information with it across the
                boundary: a party with a mere interest in the solution but no such exchange is a
                `Stakeholder` persona of the User Personas instead, and a platform element the
                solution deploys and operates itself (e.g. a managed database of its own) is a
                Deployment View node instead -- only a party or system the solution merely
                consumes or serves belongs to the system context.
            format:
                maxTableColumns: 5
            props:
                -   name: KIND
                    desc: |
                        The kind of the external entity, one of:
                        -   `Person`:       A human actor interacting with the solution.
                        -   `System`:       An external software system the solution integrates with.
                        -   `Service`:      A third-party or managed service the solution consumes.
                        -   `Datastore`:    An external data repository the solution reads from or writes to.
                        -   `Device`:       A physical device or sensor the solution communicates with.
                        -   `Organization`: An external organizational party.
                    value: enum(Person,System,Service,Datastore,Device,Organization)
                -   name: DIRECTION
                    desc: >
                        Who initiates the interaction: `Inbound` (the entity drives the solution),
                        `Outbound` (the solution drives the entity), or `Bidirectional` (both
                        sides initiate), independent of the direction the exchanged information
                        flows in, which the `DATA` property describes (e.g. a datastore the
                        solution reads from is `Outbound`, as the solution initiates, while the
                        data flows in).
                    value: enum(Inbound,Outbound,Bidirectional)
                -   name: TERMS
                    desc: >
                        Comma-separated references to the GLOSSARY terms the entity appears as in
                        the domain (usually a term of type `Actor`, which covers an external system
                        as a party acting in the domain), anchoring every boundary entity in the
                        ubiquitous language.
                    value: list([[REQS:GL.TERM:*]])
                    optional: true
                -   name: INTERFACE
                    desc: >
                        Comma-separated references to the INTERFACE-MODEL objects through which
                        the interaction happens, i.e. the interfaces the entity consumes (for a
                        `Provided` one) or offers (for a `Required` one); omitted when the
                        interaction happens through the user interface or outside any modeled
                        interface (e.g. a file exchange).
                    value: list([[APIS:IM.INTERFACE:*]])
                    optional: true
                -   name: ACTORS
                    desc: >
                        Comma-separated references to the User Personas objects acting behind the
                        entity: a `Person` entity is the boundary-level role class and the referenced
                        personas are its archetypes, while an `Organization` entity may reference
                        the `Stakeholder` personas representing it, so the entity aggregates the
                        personas instead of re-stating them; omitted when no persona stands behind
                        the entity.
                    value: list([[REQS:UP.PERSONA:*]])
                    optional: true
                -   name: PREMISES
                    desc: >
                        Comma-separated references to the SOLUTION-PREMISES objects (usually of
                        type `Dependency`) resting on this entity: the entity describes the
                        structural interaction with the external party, the premise the reliance
                        on it and the consequence of its failure, so the risky context entities
                        are found by traversal.
                    value: list([[REQS:SP.PREMISE:*]])
                    optional: true
                -   name: DATA
                    desc: >
                        The principal information exchanged across the boundary with this entity.

-   kind: ARCH
    name: Functionality View
    id: FV
    file: 24-ARCH-FV-Functionality-View.md
    desc: >
        The functional components of the solution, their responsibilities, interfaces, and primary
        interactions, describing *how* the solution's runtime elements are structured and which
        responsibility each owns, delivering the behaviors the Functional Requirements state.
    optional: true
    refs: >
        -   Rozanski/Woods: Software Systems Architecture, 2nd ed.: The Functional Viewpoint (2011),
            https://www.viewpoints-and-perspectives.info/home/viewpoints/functional/
        -   Kruchten: Architectural Blueprints -- The "4+1" View Model of Software Architecture (1995),
            https://ieeexplore.ieee.org/document/469759
        -   Brown: The C4 Model (2018),
            https://c4model.com/
    diagram:
        type: graph
        nodes: "[[ARCH:FV.COMPONENT:*]]"
        labeled: true
        properties:
            -   KIND
    childs:
        -   kind: COMPONENT
            desc: >
                A single functional component, named with a short (2-5 word) summary (e.g.
                `Authentication Service`, `Order Processor`, `Notification Dispatcher`) and
                described in a concise (1-3 sentence) paragraph whose first sentence names the
                single, primary responsibility the component owns (split into several components
                otherwise) and which elaborates how the component fulfills it and collaborates
                with the components it depends on, plus a 1-sentence rationale ("why") for the
                component's existence and boundary.
            format:
                maxTableColumns: 5
            diagram:
                type: hub
                center: self
                nodes: "[[ARCH:FV.COMPONENT:*]], [[REQS:FR.REQUIREMENT:*]], [[APIS:IM.INTERFACE:*]],
                    [[DATA:DM.ENTITY:*]]"
                labeled: true
                qualified: true
                properties:
                    -   KIND
                config:
                    size-node-width-max:    440
                    size-node-height-scale: 1.75
            props:
                -   name: KIND
                    desc: |
                        The kind of the functional component, one of:
                        -   `Component`: Cohesive unit of functionality with a defined interface.
                        -   `Service`:   Provider of functionality with an independent lifecycle.
                        -   `Module`:    Logical grouping of related functionality within a
                                         component.
                        -   `Connector`: Mediator that conveys interactions between components
                                         (e.g. bus, gateway).
                        -   `Subsystem`: Larger composite grouping several components.
                    value: enum(Component,Service,Module,Connector,Subsystem)
                -   name: PART-OF
                    desc: >
                        Reference to the FUNCTIONALITY-VIEW object this component is contained
                        in, expressing the composition hierarchy the kinds imply: a `Module`
                        references the component it groups functionality within, and a component
                        references the `Subsystem` it belongs to; omitted for a top-level
                        component.
                    value: "[[ARCH:FV.COMPONENT:*]]"
                    optional: true
                    acyclic: true
                -   name: REALIZES
                    desc: >
                        Comma-separated references to the FUNCTIONAL-REQUIREMENTS objects the
                        component realizes, i.e. whose capability its functionality delivers, so
                        that every Functional Requirement is owned by at least one component.
                    value: list([[REQS:FR.*]])
                    optional: true
                -   name: OWNS
                    desc: >
                        Comma-separated references to the DATA-MODEL entities the component owns,
                        i.e. for which it is the single authoritative source of truth (other
                        components access an owned entity through the owner's interfaces or hold
                        derived copies only), so that every entity is owned by at most one
                        component; omitted when the component owns no entity.
                    value: list([[DATA:DM.ENTITY:*]])
                    optional: true
                -   name: PROVIDES
                    desc: >
                        Comma-separated references to the INTERFACE-MODEL objects the component
                        provides, i.e. through which other components and external entities
                        interact with it; omitted when the component provides no modeled interface
                        (e.g. a user interface or an internal module).
                    value: list([[APIS:IM.INTERFACE:*]])
                    optional: true
                -   name: CONSUMES
                    desc: >
                        Comma-separated references to the INTERFACE-MODEL objects the component
                        consumes, i.e. the `Provided` interfaces of other components and the
                        `Required` interfaces offered by external entities, through which its
                        dependencies are exercised; omitted when the component consumes no
                        modeled interface.
                    value: list([[APIS:IM.INTERFACE:*]])
                    optional: true
                -   name: DEPENDS-ON
                    desc: >
                        Comma-separated references to the FUNCTIONALITY-VIEW objects this component
                        depends on at runtime, naming the target component only, while the
                        interface through which a dependency is exercised is stated by `CONSUMES`
                        where modeled.
                    value: list([[ARCH:FV.COMPONENT:*]])
                    optional: true

-   kind: ARCH
    name: Concurrency View
    id: CO
    file: 25-ARCH-CO-Concurrency-View.md
    desc: >
        The concurrency structure of the solution, mapping functional components to processes and
        threads, and defining how they coordinate and communicate. The artifact is absent when the
        solution runs as a single sequential unit of execution and has no concurrency structure
        worth describing.
    optional: true
    refs: >
        -   Rozanski/Woods: Software Systems Architecture, 2nd ed.: The Concurrency Viewpoint (2011),
            https://www.viewpoints-and-perspectives.info/home/viewpoints/concurrency/
        -   Kruchten: Architectural Blueprints -- The "4+1" View Model of Software Architecture (1995),
            https://ieeexplore.ieee.org/document/469759
        -   Schmidt et al.: Pattern-Oriented Software Architecture, Volume 2: Patterns for Concurrent and Networked Objects (2000),
            https://www.wiley.com/en-us/Pattern+Oriented+Software+Architecture,+Volume+2,+Patterns+for+Concurrent+and+Networked+Objects-p-9781118725177
    diagram:
        type: graph
        nodes: "[[ARCH:CO.UNIT:*]]"
        labeled: true
        properties:
            -   KIND
    childs:
        -   kind: UNIT
            desc: >
                A single concurrency unit, named with a short (2-5 word) summary (e.g. `Web Worker
                Pool`, `Background Scheduler`, `Ingest Queue Consumer`) and described in a concise
                (1-3 sentence) paragraph by how it executes and how it avoids or manages contention,
                races, and deadlocks (including its start order and failure/restart behavior where
                non-obvious), plus a 1-sentence rationale ("why") for the chosen concurrency
                structure.

                A unit executes work at runtime: a queue or channel between units is not a unit
                but the coordination mechanism stated in `COORDINATION`, its contract an Interface
                Model interface (e.g. of kind `MQTT` or `WebSocket`), and the platform element
                hosting a managed broker a Deployment View `Managed` node -- only the executing
                structure itself belongs to the Concurrency View.
            diagram:
                type: hub
                center: self
                nodes: "[[ARCH:CO.UNIT:*]], [[ARCH:FV.COMPONENT:*]], [[ARCH:DP.NODE:*]]"
                labeled: true
                qualified: true
                properties:
                    -   KIND
                config:
                    size-node-width-max:    440
                    size-node-height-scale: 1.75
            props:
                -   name: KIND
                    desc: |
                        The kind of the concurrency unit, one of:

                        -   `Process`:   An independent OS process with its own address space.
                        -   `Thread`:    A thread of execution within a process.
                        -   `Task`:      A lightweight cooperative task (e.g. coroutine, fiber).
                        -   `Pool`:      A managed group of interchangeable workers.
                        -   `EventLoop`: A single-threaded cooperative scheduler of tasks.
                    value: enum(Process,Thread,Task,Pool,EventLoop)
                -   name: PART-OF
                    desc: >
                        Reference to the CONCURRENCY-VIEW object this unit is contained in,
                        expressing the containment the kinds imply: a `Thread`, `Task`, `Pool`, or
                        `EventLoop` references the `Process` it executes within, and a `Task` the
                        `EventLoop` or `Pool` scheduling it; omitted for a top-level unit.
                    value: "[[ARCH:CO.UNIT:*]]"
                    optional: true
                    acyclic: true
                -   name: HOSTS
                    desc: >
                        Comma-separated references to the FUNCTIONALITY-VIEW objects that run inside
                        this concurrency unit; omitted when no modeled component runs inside it.
                    value: list([[ARCH:FV.COMPONENT:*]])
                    optional: true
                -   name: MULTIPLICITY
                    desc: >
                        How many instances of the unit run (e.g. `1`, `1 per CPU core`, `0..n
                        auto-scaled`).
                -   name: COORDINATES-WITH
                    desc: >
                        Comma-separated references to the CONCURRENCY-VIEW objects this unit
                        coordinates or communicates with at runtime, naming the peer unit only
                        (e.g. a producer names the consumer it feeds through a shared queue),
                        while the mechanism is stated by `COORDINATION`.
                    value: list([[ARCH:CO.UNIT:*]])
                    optional: true
                -   name: COORDINATION
                    desc: >
                        The mechanism by which the unit coordinates or communicates with other
                        units, usually those referenced in `COORDINATES-WITH` (e.g. `shared
                        queue`, `mutex`, `message passing`, `optimistic locking`).

-   kind: ARCH
    name: Development View
    id: DV
    file: 26-ARCH-DV-Development-View.md
    desc: >
        The architecture supporting the software development process, defining the module
        organization, build approach, and codeline conventions. The artifact is absent when the
        development conventions are governed outside the specification (e.g. by repository-level
        contributor instructions).
    optional: true
    refs: >
        -   Rozanski/Woods: Software Systems Architecture, 2nd ed.: The Development Viewpoint (2011),
            https://www.viewpoints-and-perspectives.info/home/viewpoints/development/
        -   Kruchten: Architectural Blueprints -- The "4+1" View Model of Software Architecture (1995),
            https://ieeexplore.ieee.org/document/469759
        -   Clements et al.: Documenting Software Architectures: Views and Beyond, 2nd ed. (2010),
            https://www.informit.com/store/documenting-software-architectures-views-and-beyond-9780321552686
    diagram:
        type: grid
        nodes: "[[ARCH:DV.ASPECT:*]]"
        properties:
            -   CATEGORY
    childs:
        -   kind: ASPECT
            desc: >
                A single development aspect, named with a short (2-5 word) summary (e.g. `Module
                Layering`, `Build Pipeline`, `Branching Model`) and described in a concise (1-3
                sentence) paragraph by the development convention or structure and the rule
                developers must follow, plus a 1-sentence rationale ("why").

                An aspect states a standing developer-facing rule about the source structure and
                process: it names no concrete products (a Technology Stack `Build-Time` component
                states the product choice), does not restate the runtime structure (a Functionality
                View `Module` or `Subsystem` groups the logic), does not cover production
                procedures (an Operations View concern does), and the trade-off that produced a
                rule is a Decision Record referencing the aspect through `AFFECTS`.
            props:
                -   name: CATEGORY
                    desc: >
                        The development concern the aspect governs: `Structure` (the physical
                        source module/package layout), `Build` (compilation and packaging),
                        `Dependency` (the allowed dependency edges between the structures),
                        `Codeline` (branching, merging, versioning), `Standardization` (coding
                        standards and conventions), `Testing` (test conventions, layout, and
                        coverage rules), or `Tooling` (development tools and automation).
                    value: enum(Structure,Build,Dependency,Codeline,Standardization,Testing,Tooling)

-   kind: ARCH
    name: Deployment View
    id: DP
    file: 27-ARCH-DP-Deployment-View.md
    desc: >
        The environment into which the solution is deployed, partitioning it into tiers and mapping
        software elements to the runtime platform, hardware, and network topology.
    optional: true
    refs: >
        -   Rozanski/Woods: Software Systems Architecture, 2nd ed.: The Deployment Viewpoint (2011),
            https://www.viewpoints-and-perspectives.info/home/viewpoints/deployment/
        -   Kruchten: Architectural Blueprints -- The "4+1" View Model of Software Architecture (1995),
            https://ieeexplore.ieee.org/document/469759
        -   Brown: The C4 Model: Deployment Diagram (2018),
            https://c4model.com/diagrams/deployment
    diagram:
        type: graph
        nodes: "[[ARCH:DP.NODE:*]]"
        labeled: true
        properties:
            -   TIER
            -   AREA
            -   KIND
            -   PLATFORM
        config:
            size-node-width-max: 350
    childs:
        -   kind: TIER
            desc: >
                A single deployment tier, named with a short (1-3 word) summary (e.g. `Client`,
                `Server`, `Database`, `Data Center`) and described in a concise (1-3 sentence)
                paragraph by the code or data it hosts and its spatial and network separation from
                the other tiers, plus a 1-sentence rationale ("why") for the partitioning.

                A tier is a logically and spatially distinct, network-connected, technology-induced
                partition of the solution, the *horizontal* split when drawn (an `AREA` is the
                *vertical*, domain-induced one): every node belongs to exactly one tier via its
                `TIER`, a location-level tier (e.g. a data center) groups the tiers referencing it
                via `PART-OF`, and a single deployment unit within a tier is a `NODE` -- only the
                partition itself belongs here.
            format:
                type: concise
            diagram:
                type: hub
                center: self
                nodes: "[[ARCH:DP.TIER:*]], [[ARCH:DP.NODE:*]]"
                labeled: true
                qualified: true
                properties:
                    -   LOCATION
                    -   KIND
                config:
                    size-node-width-max:    440
                    size-node-height-scale: 1.75
            props:
                -   name: PART-OF
                    desc: >
                        Reference to the DEPLOYMENT-VIEW tier this tier is contained in (e.g. the
                        `Server` and `Database` tiers reference the `Data Center` tier hosting
                        them); omitted for a top-level tier.
                    value: "[[ARCH:DP.TIER:*]]"
                    optional: true
                    acyclic: true
                -   name: LOCATION
                    desc: >
                        Where the tier physically runs (e.g. `Hetzner data center Nürnberg, dev/QA/prod
                        environments`, `attendee and operator devices`, `Cloudflare edge`); omitted
                        when inherited from the `PART-OF` tier.
                    optional: true
                -   name: STACK
                    desc: >
                        Reference to the TECHNOLOGY-STACK tier whose products run in this tier;
                        omitted when the Technology Stack is absent, has no matching tier, or the
                        tier (e.g. a data center) groups other tiers only.
                    value: "[[ARCH:TS.TIER:*]]"
                    optional: true
        -   kind: AREA
            desc: >
                A single deployment area, named with a short (1-3 word) summary (e.g. `Ordering`,
                `Billing`, `Identity`) and described in a concise (1-3 sentence) paragraph by the
                domain it covers and its separation from the other areas, plus a 1-sentence rationale
                ("why") for the partitioning.

                An area is a logically distinct, domain-induced partition of the solution deployed
                as physical units of its own, the *vertical* split when drawn (a `TIER` is the
                *horizontal*, technology-induced one): a node dedicated to the area references it via
                its `AREA`, a node shared by several areas references none, and a domain grouping
                without deployment units of its own is a Functionality View `Subsystem` instead. The
                kind is absent when the solution is not split vertically.
            optional: true
            format:
                type: concise
            diagram:
                type: hub
                center: self
                nodes: "[[ARCH:DP.AREA:*]], [[ARCH:DP.NODE:*]]"
                labeled: true
                qualified: true
                properties:
                    -   KIND
                config:
                    size-node-width-max:    440
                    size-node-height-scale: 1.75
        -   kind: NODE
            desc: >
                A single deployment node, named with a short (2-5 word) summary (e.g. `Web Servers`,
                `Database Cluster`, `Edge CDN`) and described in a concise (1-3 sentence) paragraph
                by the node, its sizing, and its place in the deployment topology, plus a 1-sentence
                rationale ("why") for the node's placement and platform choice.

                A node is a platform element the solution deploys onto and operates itself: a
                managed third-party service the solution merely consumes is a Context View
                `Service` entity, the software products running on the node are Technology Stack
                components (reached through the hosted units and components), and the procedures
                operating the node are Operations View concerns -- only the runtime environment
                itself belongs to the Deployment View, with the tier and area the node belongs to
                and the network segments it is attached to as its `TIER`, `AREA`, and `NETWORK`
                siblings.
            diagram:
                type: hub
                center: self
                nodes: "[[ARCH:DP.TIER:*]], [[ARCH:DP.AREA:*]], [[ARCH:DP.NODE:*]],
                    [[ARCH:DP.NETWORK:*]], [[ARCH:FV.COMPONENT:*]], [[ARCH:CO.UNIT:*]]"
                labeled: true
                qualified: true
                properties:
                    -   LOCATION
                    -   KIND
                    -   PLATFORM
                    -   SCOPE
                config:
                    size-node-width-max:    440
                    size-node-height-scale: 1.75
            props:
                -   name: KIND
                    desc: |
                        The kind of the deployment node, one of:
                        -   `Server`:    A physical or virtual machine.
                        -   `Container`: A containerized runtime (e.g. Docker, OCI).
                        -   `Cluster`:   A group of nodes managed as one (e.g. Kubernetes cluster),
                                         containing the nodes referencing it via `PART-OF`.
                        -   `Function`:  A serverless / function-as-a-service runtime.
                        -   `Device`:    An edge or client device.
                        -   `Managed`:   A managed cloud service (e.g. managed database, queue).
                    value: enum(Server,Container,Cluster,Function,Device,Managed)
                -   name: TIER
                    desc: >
                        Reference to the DEPLOYMENT-VIEW tier the node belongs to, exactly one, as a
                        single deployment unit never spans tiers.
                    value: "[[ARCH:DP.TIER:*]]"
                -   name: AREA
                    desc: >
                        Reference to the DEPLOYMENT-VIEW area the node is dedicated to, at most one,
                        as a single deployment unit never spans areas; omitted for a node shared by
                        several areas or when the solution is not split vertically.
                    value: "[[ARCH:DP.AREA:*]]"
                    optional: true
                -   name: PLATFORM
                    desc: >
                        The execution platform of the node, i.e. its operating system, runtime, or
                        cloud service (e.g. `Linux x86-64`, `Kubernetes 1.30`, `AWS Lambda
                        (Node.js)`), not the software products running on it, which are Technology
                        Stack components.
                -   name: PART-OF
                    desc: >
                        Reference to the DEPLOYMENT-VIEW object this node is contained in,
                        expressing the nesting the kinds imply: a `Container` references the
                        `Server` or `Cluster` running it, and a `Server` the `Cluster` it belongs
                        to; omitted for a top-level node.
                    value: "[[ARCH:DP.NODE:*]]"
                    optional: true
                    acyclic: true
                -   name: HOSTS
                    desc: >
                        Comma-separated references to the CONCURRENCY-VIEW or FUNCTIONALITY-VIEW
                        objects deployed onto this node: the concurrency units executing on the
                        node (which themselves state the components they host), and the functional
                        components not mapped by any concurrency unit directly. A containing node
                        does not repeat what its `PART-OF` nodes host.
                    value: list([[ARCH:CO.UNIT:*]], [[ARCH:FV.COMPONENT:*]])
                    optional: true
                -   name: INSTANCES
                    desc: >
                        How many instances of the node run (e.g. `1`, `3 per environment`, `0..n
                        auto-scaled`).
                    optional: true
                -   name: CONNECTS-TO
                    desc: >
                        Comma-separated references to the DEPLOYMENT-VIEW objects this node opens
                        network connections to at runtime, naming the target node only, while the
                        carried protocols are stated by the `PROTOCOLS` of the shared `NETWORK`.
                    value: list([[ARCH:DP.NODE:*]])
                    optional: true
                -   name: NETWORKS
                    desc: >
                        Comma-separated references to the DEPLOYMENT-VIEW network segments the node
                        is attached to (e.g. a public ingress and a private backend network); omitted
                        when the topology models no network segments.
                    value: list([[ARCH:DP.NETWORK:*]])
                    optional: true
        -   kind: NETWORK
            desc: >
                A single network segment the deployment nodes are attached to, named with a short
                (2-5 word) summary (e.g. `Public Internet`, `Backend VLAN`, `Database Subnet`) and
                described in a concise (1-3 sentence) paragraph by its reach, its isolation from the
                other segments, and the traffic it carries, plus a 1-sentence rationale ("why") for
                the segmentation.

                A segment is the medium the nodes communicate over: the attached nodes reference it
                via `NETWORKS`, the directed links between them are their `CONNECTS-TO` references,
                and the contract of the carried traffic is an Interface Model interface -- only the
                network itself belongs here. The kind is absent when the topology has no
                segmentation worth describing.
            optional: true
            format:
                type: concise
            diagram:
                type: hub
                center: self
                nodes: "[[ARCH:DP.NETWORK:*]], [[ARCH:DP.NODE:*]]"
                labeled: true
                qualified: true
                properties:
                    -   KIND
                    -   SCOPE
                config:
                    size-node-width-max:    440
                    size-node-height-scale: 1.75
            props:
                -   name: SCOPE
                    desc: |
                        The reach of the segment, one of:
                        -   `Public`:   Reachable from the Internet.
                        -   `Private`:  Reachable from the solution's own nodes only.
                        -   `Isolated`: Reachable from selected nodes only (e.g. a database subnet).
                    value: enum(Public,Private,Isolated)
                -   name: PROTOCOLS
                    desc: >
                        The protocols and ports carried by the segment (e.g. `HTTPS 443, WSS 443`,
                        `HTTP, WS, TCP 5432`).
                -   name: ADDRESSING
                    desc: >
                        The address range or naming of the segment (e.g. `10.0.0.0/8`, `public IPv4
                        and IPv6`, `*.example.com`).
                    optional: true

-   kind: ARCH
    name: Operations View
    id: OV
    file: 28-ARCH-OV-Operations-View.md
    desc: >
        The way the solution is operated, administered, and supported in production, defining the
        standing procedures by which the operating organization installs, configures, migrates,
        observes, protects, upgrades, scales, and supports the running solution.
    optional: true
    refs: >
        -   Rozanski/Woods: Software Systems Architecture, 2nd ed.: The Operational Viewpoint (2011),
            https://www.viewpoints-and-perspectives.info/home/viewpoints/operational/
        -   Beyer et al.: Site Reliability Engineering: How Google Runs Production Systems (2016),
            https://sre.google/sre-book/table-of-contents/
        -   ISO/IEC 20000-1:2018: Information technology -- Service management -- Part 1: Service management system requirements (2018),
            https://www.iso.org/standard/70636.html
    diagram:
        type: grid
        nodes: "[[ARCH:OV.CONCERN:*]]"
        properties:
            -   CATEGORY
    childs:
        -   kind: CONCERN
            desc: >
                A single operational concern, named with a short (2-5 word) summary (e.g. `Rolling
                Deployment`, `Metrics Collection`, `Backup and Restore`) and described in a concise
                (1-3 sentence) paragraph by the procedure through which it is handled in production
                and the steps and tools supporting it, plus a 1-sentence rationale ("why") for the
                operational approach.

                A concern states a standing production procedure the operating organization
                performs on the running solution: a capability the solution offers its users (even
                an administrating one) is a Functional Requirement or Use Case, an automatic
                behavior of the solution is a Domain Rule, the design tactic making the solution
                operable (e.g. replication, statelessness) is a Quality Perspectives tactic
                referenced through `OPERATES`, the deployment shape acted upon (instances,
                environments) is the
                Deployment View, the pipeline producing the deployable artifact is a Development
                View `Build` aspect, and the products used are Technology Stack `Operate-Time`
                components referenced through `TOOLS` -- only the procedure itself, its trigger,
                and its responsible operator belong here.
            diagram:
                type: hub
                center: self
                nodes: "[[ARCH:OV.CONCERN:*]], [[REQS:NR.REQUIREMENT:*]], [[REQS:UP.PERSONA:*]],
                    [[ARCH:QP.TACTIC:*]], [[ARCH:FV.COMPONENT:*]], [[ARCH:CO.UNIT:*]],
                    [[ARCH:DP.NODE:*]], [[DATA:DM.ENTITY:*]], [[ARCH:TS.TIER:*.COMPONENT:*]]"
                labeled: true
                qualified: true
                properties:
                    -   CATEGORY
                config:
                    size-node-width-max:    440
                    size-node-height-scale: 1.75
            props:
                -   name: CATEGORY
                    desc: |
                        The category of the concern, one of:
                        -   `Installation`:   Provisioning the environments and installing the
                                              solution into them.
                        -   `Configuration`:  Managing the configuration of the installed solution.
                        -   `Migration`:      Moving data or functionality between versions or
                                              environments.
                        -   `Monitoring`:     Observing the health and performance of the running
                                              solution.
                        -   `Logging`:        Collecting, retaining, and inspecting the logs.
                        -   `Alerting`:       Notifying the operators of conditions requiring
                                              attention.
                        -   `Backup`:         Preserving the data and state of the solution.
                        -   `Recovery`:       Restoring the solution after a failure or data loss.
                        -   `Upgrade`:        Rolling out new versions of the solution.
                        -   `Capacity`:       Scaling the solution and planning its capacity.
                        -   `Administration`: Routine housekeeping (e.g. user administration, data
                                              retention, certificate rotation).
                        -   `Incident`:       Troubleshooting and responding to incidents.
                        -   `Support`:        Handling the requests of the users through the support
                                              tiers and their escalation.
                    value: enum(Installation,Configuration,Migration,Monitoring,Logging,Alerting,Backup,Recovery,Upgrade,Capacity,Administration,Incident,Support)
                -   name: TRIGGER
                    desc: >
                        When the procedure is performed (e.g. `nightly`, `on release`, `on alert`,
                        `before each event`, `on demand`), separating the routine (scheduled)
                        concerns from the reactive (event-driven) ones.
                -   name: OPERATOR
                    desc: >
                        Comma-separated references to the User Personas objects performing the
                        procedure, usually a `Stakeholder` persona like the operations team (a
                        procedure performed by a `User` persona through the solution is a Use Case
                        instead); omitted when no persona of the operating organization is modeled.
                    value: list([[REQS:UP.PERSONA:*]])
                    optional: true
                -   name: ADDRESSES
                    desc: >
                        Comma-separated references to the NON-FUNCTIONAL-REQUIREMENTS objects the
                        procedure fulfills (e.g. a recovery objective, a retention obligation);
                        omitted when the concern fulfills no stated requirement.
                    value: list([[REQS:NR.*]])
                    optional: true
                -   name: OPERATES
                    desc: >
                        Comma-separated references to the QUALITY-PERSPECTIVES objects whose design
                        mechanism the procedure acts upon (e.g. the replication scaled out, the
                        backup restored); omitted when the procedure operates no modeled tactic.
                    value: list([[ARCH:QP.TACTIC:*]])
                    optional: true
                -   name: ELEMENTS
                    desc: >
                        Comma-separated references to the FUNCTIONALITY-VIEW, CONCURRENCY-VIEW,
                        DEPLOYMENT-VIEW, or DATA-MODEL objects the procedure acts upon (e.g. the
                        nodes scaled, the units restarted, the entities backed up or migrated).
                    value: list([[ARCH:FV.COMPONENT:*]], [[ARCH:CO.UNIT:*]], [[ARCH:DP.TIER:*]],
                        [[ARCH:DP.AREA:*]], [[ARCH:DP.NODE:*]], [[ARCH:DP.NETWORK:*]],
                        [[DATA:DM.ENTITY:*]])
                    optional: true
                -   name: TOOLS
                    desc: >
                        Comma-separated references to the TECHNOLOGY-STACK components (usually of
                        `WHEN` `Operate-Time`) supporting the procedure; omitted when the procedure
                        uses no modeled product.
                    value: list([[ARCH:TS.TIER:*.COMPONENT:*]])
                    optional: true

-   kind: ARCH
    name: Quality Perspectives
    id: QP
    file: 29-ARCH-QP-Quality-Perspectives.md
    desc: >
        How the Non-Functional Requirements (NR) are addressed by the architecture, through the
        tactics built into the solution across the views.
    optional: true
    refs: >
        -   Rozanski/Woods: Software Systems Architecture, 2nd ed.: The Perspectives (2011),
            https://www.viewpoints-and-perspectives.info/home/perspectives/
        -   Bass/Clements/Kazman: Software Architecture in Practice, 4th ed. (2021),
            https://www.informit.com/store/software-architecture-in-practice-9780136886099
        -   ISO/IEC 25010:2023: Systems and software engineering -- Systems and software Quality Requirements and Evaluation (SQuaRE) -- Product quality model (2023),
            https://www.iso.org/standard/78176.html
    diagram:
        type: grid
        nodes: "[[ARCH:QP.TACTIC:*]]"
        properties:
            -   QUALITY
    childs:
        -   kind: TACTIC
            desc: >
                A single quality tactic, one architectural tactic applied to one quality attribute
                (the perspective in the sense of Rozanski/Woods, i.e. the cross-cutting quality
                concern applied to the elements of all views, identified by `QUALITY`), named with
                a short (2-5 word) summary (e.g. `Horizontal Scaling`, `Defense in Depth`,
                `Graceful Degradation`) and described in a concise (1-3 sentence) paragraph by how
                the tactic satisfies the quality attribute across the affected elements, plus a
                1-sentence rationale ("why") for the tactic satisfying the addressed requirements
                (not for choosing it over alternatives, which is the rationale of a Decision
                Record).

                A tactic states a design mechanism built into the solution: the threshold the
                mechanism has to meet is the `METRIC` of the addressed Non-Functional Requirement
                and is not restated, the production procedure performed against the mechanism
                (e.g. scaling out, restoring) is an Operations View concern referencing the tactic
                through `OPERATES`, the trade-off that chose the mechanism over alternatives is a
                Decision Record referenced through `DECIDED-BY`, the product realizing the
                mechanism is a Technology Stack component referenced through `TOOLS`, the
                developer-facing rule about the source structure is a Development View aspect, and
                a mechanism driven solely by a `Constraint` requirement (e.g. a hosting or budget
                mandate) protects no quality and is a Decision Record alone -- only the mechanism,
                the quality it achieves, and the elements it shapes belong here.
            diagram:
                type: hub
                center: self
                nodes: "[[ARCH:QP.TACTIC:*]], [[REQS:NR.REQUIREMENT:*]], [[ARCH:FV.COMPONENT:*]],
                    [[ARCH:CO.UNIT:*]], [[ARCH:DV.ASPECT:*]], [[ARCH:DP.NODE:*]], [[DATA:DM.ENTITY:*]],
                    [[ARCH:DR.DECISION:*]], [[ARCH:TS.TIER:*.COMPONENT:*]]"
                labeled: true
                qualified: true
                properties:
                    -   QUALITY
                config:
                    size-node-width-max: 440
            props:
                -   name: QUALITY
                    desc: >
                        The quality attribute the tactic addresses, a solution-oriented
                        refinement of the NON-FUNCTIONAL-REQUIREMENTS categories which intentionally
                        differs from them.

                        The NR categories follow the ISO/IEC 25010:2023 top-level characteristics
                        plus the non-quality categories `Compliance` and `Constraint`, whereas the
                        tactic qualities decompose some of the characteristics into the
                        finer-grained, architecturally actionable attributes `Scalability`,
                        `Availability`, `Privacy`, `Accessibility`, and `Portability` (with
                        `Flexibility` fully absorbed by `Scalability` and `Portability`), and
                        address a `Compliance` or `Constraint` requirement through the quality it
                        protects (e.g. a data protection obligation through `Privacy`). The
                        quality therefore need not match the category of the requirements it
                        addresses.
                    value: enum(Performance,Scalability,Reliability,Availability,Safety,Security,Privacy,Usability,Accessibility,Maintainability,Portability,Compatibility)
                -   name: ADDRESSES
                    desc: >
                        Comma-separated references to the NON-FUNCTIONAL-REQUIREMENTS objects the
                        tactic addresses.
                    value: list([[REQS:NR.*]])
                -   name: MECHANISM
                    desc: >
                        The design mechanism through which the tactic is applied to achieve the
                        quality (e.g. `stateless replication behind a load balancer`,
                        `read-through cache`, `circuit breaker`).
                -   name: TRADES-OFF
                    desc: >
                        Comma-separated quality attributes (from the same set as `QUALITY`) the
                        tactic knowingly degrades in favor of the addressed one (e.g. a one-time
                        token trades `Usability` for `Security`); omitted when the tactic has no
                        notable cost on another quality.
                    value: tags(Performance,Scalability,Reliability,Availability,Safety,Security,Privacy,Usability,Accessibility,Maintainability,Portability,Compatibility)
                    optional: true
                -   name: DECIDED-BY
                    desc: >
                        Reference to the DECISION-RECORD object which chose the tactic over its
                        alternatives; omitted when the choice qualifies for no decision record.
                    value: "[[ARCH:DR.DECISION:*]]"
                    optional: true
                -   name: AFFECTS
                    desc: >
                        Comma-separated references to the FUNCTIONALITY-VIEW, CONCURRENCY-VIEW,
                        DEVELOPMENT-VIEW, DEPLOYMENT-VIEW, DATA-MODEL, AUTHORIZATION-MODEL, or
                        INTERFACE-MODEL objects the tactic shapes (e.g. the components replicated,
                        the aspects governing modifiability, the entities anonymized, the roles
                        and interfaces secured).
                    value: list([[ARCH:FV.COMPONENT:*]], [[ARCH:CO.UNIT:*]], [[ARCH:DV.ASPECT:*]],
                        [[ARCH:DP.TIER:*]], [[ARCH:DP.AREA:*]], [[ARCH:DP.NODE:*]], [[ARCH:DP.NETWORK:*]],
                        [[DATA:DM.ENTITY:*]], [[DATA:AM.ROLE:*]], [[APIS:IM.INTERFACE:*]])
                    optional: true
                -   name: TOOLS
                    desc: >
                        Comma-separated references to the TECHNOLOGY-STACK components realizing the
                        tactic (e.g. the load balancer, the message broker, the CDN); omitted when
                        the tactic uses no modeled product.
                    value: list([[ARCH:TS.TIER:*.COMPONENT:*]])
                    optional: true

-   kind: ARCH
    name: Technology Stack
    id: TS
    file: 31-ARCH-TS-Technology-Stack.md
    desc: >
        The concrete technology products the solution is built upon, organized by tier and lifecycle
        phase, recording for each component its chosen product, its purpose, and the alternatives
        that were considered but not chosen.
    optional: true
    refs: >
        -   ThoughtWorks: Technology Radar (2010),
            https://www.thoughtworks.com/radar
        -   Ford: Build Your Own Technology Radar (2013),
            https://nealford.com/memeagora/2013/05/28/build_your_own_technology_radar.html
        -   Fowler: Patterns of Enterprise Application Architecture (2002),
            https://martinfowler.com/books/eaa.html
    diagram:
        type: grid
        nodes: "[[ARCH:TS.TIER:*]]"
    childs:
        -   kind: TIER
            name: (?:Client|Server|Middleware|Database)
            desc: |
                The architectural tier grouping the technology components belonging to it, one of:

                -   `Client`:     Runs on the client side (e.g. browser, desktop, mobile).
                -   `Server`:     Runs on the server side (e.g. backend, application, API).
                -   `Middleware`: Runs between client and server (e.g. message broker, gateway).
                -   `Database`:   Runs as the data store (e.g. relational or document database).
            diagram:
                type: hub
                center: self
                hierarchy: true
                properties:
                    -   PRODUCT
                config:
                    size-node-width-max: 440
                    size-node-height-scale: 1.75
            childs:
                -   kind: COMPONENT
                    desc: >
                        A single technology component, named with a short (2-5 word) summary (e.g.
                        `UI Framework`, `Web Server`, `Relational Database`) and described in a
                        concise (1-3 sentence) paragraph by how the product is used within the
                        solution and how it fits into the overall technology stack, plus a
                        1-sentence rationale ("why") for choosing this product over the
                        alternatives.
                    props:
                        -   name: PRODUCT
                            desc: >
                                The concrete product, library, or framework chosen for this
                                component (e.g. `VueJS`, `Node.js`, `PostgreSQL`).
                        -   name: ALTERNATIVES
                            desc: >
                                Comma-separated names of products which would also fit this
                                component but were not chosen (e.g. `React, Svelte`).
                            optional: true
                        -   name: COVERAGE
                            desc: |
                                A comma-separated list of either one or more of the *Client
                                Aspects* or one or more of the *Server Aspects* (or their
                                sub-aspects) defined below. The general goal is to achieve a
                                maximum coverage of all aspects per `TIER` with the minimum
                                total number of `PRODUCT`s.

                                The known *Client Aspects* which usually have to be covered (at
                                least for clients in a Rich-Client architecture):

                                -   **Interface Theme**:
                                    Style Reset, Shape, Color, Gradient, Shadow, Font, Icon.

                                -   **Interface Widgets**:
                                    Icon, Label, Text Paragraph, Image, Form, Text-Field,
                                    Text-Area, Date Picker, Toggle, Radio Button, Checkbox,
                                    Select List, Slider, Progress Bar, Hyperlink, Popup Menu,
                                    Dropdown Menu, Toolbar, Tooltip, Tab, Pill, Breadcrumb,
                                    Pagination, Badge, Alert, Panel, Modal, Table, Scrollbar,
                                    Carousel.

                                -   **Interface Layouting**:
                                    Responsive Design, Media Query, Frame, Grid, Padding, Border,
                                    Margin, Alignment, Force, Magnetism.

                                -   **Interface Effects**:
                                    Transition, Transformation, Keyframes, Easing Function, Sound
                                    Effect, Physics.

                                -   **Interface Interactions**:
                                    Mouse, Keyboard, Touchscreen, Gesture, Clipboard, Drag & Drop.

                                -   **Interface States**:
                                    Rendered, Enabled, Visible, Focused, Warning, Error, Floating.

                                -   **Interface Mask**:
                                    Markup Loading, Markup Generation, Virtual DOM, Text, Bitmaps,
                                    Vectors, 2D/3D Canvas, Accessibility.

                                -   **Interface Internationalization**:
                                    Text Internationalization (I18N).

                                -   **Data Conversion**:
                                    Value Formatting, Value Parsing, Localization (L10N).

                                -   **Data Binding**:
                                    Reactive, Observer, Unidirectional, Bidirectional, Incremental.

                                -   **Presentation Model**:
                                    Parameter Value, Command Value, State Value, Data Value, Event
                                    Value, Value Validation, Presentation Logic.

                                -   **Dialog Navigation**:
                                    Deep Linking, Routing, Dialog Flow.

                                -   **Dialog Automation**:
                                    Dialog Macros, Click-Through, Smoke Testing.

                                -   **Dialog Communication**:
                                    Service, Event, Model, Socket, Hooks.

                                -   **Dialog Life-Cycle**:
                                    Component States, Component State Transitions.

                                -   **Dialog Structure**:
                                    Component, Model/View/Controller Roles, Hierarchical
                                    Composition.

                                -   **State Persistence**:
                                    Local Storage, Cookies, Caching.

                                -   **Business Model**:
                                    Entity, Field, Relationship, Universally Unique Identifiers
                                    (UUID).

                                -   **Use-Case Authorization**:
                                    User Experience, Dialog Restriction, User, Group, Role,
                                    Use-Case, Data, Access.

                                -   **Client Networking**:
                                    Request/Response, Synchronization, Push, Pull, Pulled-Push,
                                    REST, GraphQL, Authentication, Session.

                                -   **Environment Detection**:
                                    Runtime Detection, Feature Detection.

                                The known *Server Aspects* which usually have to be covered (at
                                least for servers, sometimes called Thin-Servers, in a Rich-Client
                                architecture):

                                -   **Environment Detection**:
                                    Detect the run-time environment, like underlying operating
                                    system, execution platform, network topology, feature toggles,
                                    etc.

                                -   **Argument Parsing**:
                                    Parse options and arguments of the Command-Line Interface
                                    (CLI) to bootstrap application parameters.

                                -   **Configuration Parsing**:
                                    Load and parse directives from a configuration file to
                                    bootstrap application parameters.

                                -   **Process Daemonizing**:
                                    Detach from the startup terminal and host process in order to
                                    run fully independently.

                                -   **Process Management**:
                                    (Pre-)fork child processes and/or threads of execution and
                                    monitor and control them during the life-cycle of the
                                    application.

                                -   **Component Management**:
                                    Structure the code into components, instantiate them at
                                    run-time and manage them in a stateful component life-cycle.

                                -   **Component Communication**:
                                    Provide inter-component communication mechanisms like events,
                                    hooks, registry, etc.

                                -   **Server Networking**:
                                    Listen to network sockets, accept connections and manage
                                    request/response and message communication.

                                -   **Peer Information**:
                                    Determine unique identification and add-on information about
                                    the client peer.

                                -   **Session Handling**:
                                    Manage secured per-connection sessions to keep state between
                                    communication requests and/or client sessions.

                                -   **User Authentication**:
                                    Determine and validate the unique identity of the user
                                    communicating over the current network connection.

                                -   **Request Validation**:
                                    Validate the syntactical and semantical compliance of the
                                    requests and sanitize the requests.

                                -   **Request Processing**:
                                    Process the request by dispatching execution according to the
                                    provided request and determined context information.

                                -   **Role Authorization**:
                                    Determine whether the role of the current user is allowed to
                                    execute the current request.

                                -   **Client Networking**:
                                    Provide mechanisms to connect to peers over the network and
                                    perform request/response and/or publish/subscribe
                                    communication.

                                -   **Task Scheduling**:
                                    Schedule and execute recurring tasks independent of regular
                                    I/O operations.

                                -   **Execution Tracing**:
                                    Provide mechanisms for tracing the execution by logging event
                                    and measurement information at certain points of interest.

                                -   **Database Access**:
                                    Map in-memory domain entities onto a data-store-dependent
                                    persistent data structure.

                                -   **Database Connectivity**:
                                    Locally or remotely connect the database access layer to the
                                    underlying data store.

                                -   **Database Schema**:
                                    Create, update or downgrade the data schema inside the
                                    underlying data store.

                                -   **Database Bootstrapping**:
                                    Create, update or downgrade both mandatory bootstrapping and
                                    optional domain-specific data inside the underlying data
                                    store.
                            optional: true
                        -   name: WHEN
                            desc: |
                                The lifecycle phase in which the component is relevant, one of:

                                -   `Build-Time`:   Used during development, compilation, or
                                                    packaging.
                                -   `Run-Time`:     Used while the solution executes in
                                                    production.
                                -   `Operate-Time`: Used to operate the solution in production
                                                    (e.g. for rollout, monitoring, or backup),
                                                    referenced by the Operations View concerns
                                                    through `TOOLS`.
                            value: enum(Build-Time,Run-Time,Operate-Time)
                            optional: true


-   kind: ARCH
    name: Decision Record
    id: DR
    file: 30-ARCH-DR-Decision-Record.md
    desc: >
        The major decisions related to the architecture, each recording the forces at play, the
        chosen response, and the reasoning that justifies it.
    optional: true
    refs: >
        -   Nygard: Documenting Architecture Decisions (2011),
            https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions
        -   Tyree/Akerman: Architecture Decisions: Demystifying Architecture (2005),
            https://ieeexplore.ieee.org/document/1407822
        -   ADR: Architectural Decision Records (2017),
            https://adr.github.io/
    diagram:
        type: grid
        nodes: "[[ARCH:DR.DECISION:*]]"
        properties:
            -   STATUS
        config:
            size-node-width-max: 440
            grid-columns-max: 5
    childs:
        -   kind: DECISION
            desc: |
                A single architecture decision, named with a short summary of the decision, not
                longer than 80 characters, and recorded as its context (`WHEN`), the decision
                itself (`WHAT`), its rationale (`WHY`), and optional background (`NOTES`).

                A decision *MUST* qualify on all of the following three tenets:

                -   **Hard to Reverse**: the cost of changing it later is meaningful ("Oh my god,
                    this would result in a dramatic refactoring!"). So, if a decision is easy to
                    reverse, just skip it.

                -   **Surprising without Context**: a future architect will look at the code and
                    wonder ("Why on earth did they do it this way?"). So, if a decision is not
                    surprising, nobody will wonder why.

                -   **Result of a Real Trade-Off**: there were genuine alternatives and one was
                    picked for specific reasons ("We deliberately chose this, because..."). So, if
                    there was no real alternative, there's nothing to record beyond "we did the
                    obvious thing."

                The following typically qualify as a decision:

                -   **Architectural shape.** "We're using a monorepo." "The write model is
                    event-sourced, the read model is projected into PostgreSQL."

                -   **Integration patterns between contexts.** "Ordering and Billing communicate
                    via domain events, not synchronous HTTP."

                -   **Technology choices that carry lock-in.** Database, message bus, auth
                    provider, deployment target. Not every library - just the ones that would take
                    a quarter to swap out.

                -   **Boundary and scope decisions.** "Customer data is owned by the Customer
                    context; other contexts reference it by ID only." The explicit no's are as
                    valuable as the yes's.

                -   **Deliberate deviations from the obvious path.** "We're using manual SQL
                    instead of an ORM because X." Anything where a reasonable reader would assume
                    the opposite. These stop the next engineer from "fixing" something that was
                    deliberate.

                -   **Constraints not visible in the code.** "We can't use AWS because of
                    compliance requirements." "Response times must be under 200ms because of the
                    partner API contract."

                -   **Rejected alternatives when the rejection is non-obvious.** If you considered
                    GraphQL and picked REST for subtle reasons, record it - otherwise someone will
                    suggest GraphQL again in six months.

                `WHEN`, `WHAT`, and `WHY` are each just a single paragraph of concise and brief
                prose text, usually comprised of just 1 to 3 sentences. The value of a decision is
                in recording *that* a decision was made and *why* - not in filling out sections of
                a document.

                For the relationship between context, decision, and rationale, good checks are:
                the "litmus test" is that context = forces, decision = response to those forces,
                rationale = why the decision answers the forces in the context. The decision
                should feel like the natural, almost inevitable answer to the context - if a reader
                is surprised by the decision, either the context is missing a force, or the
                decision is under-justified. The rationale should make the decision feel earned,
                not asserted - if you delete the rationale and the decision suddenly looks
                arbitrary, the rationale was doing its job.
            diagram:
                type: hub
                center: self
                nodes: "[[ARCH:DR.DECISION:*]], [[ARCH:FV.COMPONENT:*]], [[ARCH:DV.ASPECT:*]],
                    [[ARCH:DP.NODE:*]]"
                labeled: true
                qualified: true
                properties:
                    -   STATUS
                config:
                    size-node-width-max: 440
            props:
                -   name: STATUS
                    desc: >
                        The status of the decision: `proposed`, `accepted`, `deprecated`, or
                        `superseded`.
                    value: enum(proposed,accepted,deprecated,superseded)
                -   name: AFFECTS
                    desc: >
                        Comma-separated references to the FUNCTIONALITY-VIEW, DEVELOPMENT-VIEW, or
                        DEPLOYMENT-VIEW objects the decision affects.
                    value: list([[ARCH:FV.COMPONENT:*]], [[ARCH:DV.ASPECT:*]], [[ARCH:DP.TIER:*]],
                        [[ARCH:DP.AREA:*]], [[ARCH:DP.NODE:*]], [[ARCH:DP.NETWORK:*]])
                    optional: true
                -   name: SUPERSEDED-BY
                    desc: >
                        Reference to the DECISION-RECORD object that supersedes this decision.
                        Should be present if and only if `STATUS` is `superseded`.
                    value: "[[ARCH:DR.DECISION:*]]"
                    optional: true
                -   name: WHEN
                    desc: |
                        The **Context** of the decision: it captures the situation that forces the
                        decision - the "why are we even talking about this" part. It describes the
                        situation as it is, before the decision is made. The following usually
                        goes into it:

                        -   the problem or need (what's broken, missing, or about to change that
                            requires a decision);
                        -   the forces at play (technical constraints, business requirements,
                            deadlines, team skills, existing systems, regulatory/compliance
                            pressures - often competing, and that tension is the whole point);
                        -   relevant facts (current architecture, prior decisions, assumptions,
                            what's known and what's uncertain); and
                        -   scope/boundaries (what this decision is and isn't about).

                        It is written neutrally and factually. It should not contain the decision
                        itself, nor advocate for an option - a reader should be able to read it,
                        pause, and arrive at the decision themselves because the forces make it
                        (nearly) inevitable.
                -   name: WHAT
                    desc: |
                        The **Decision** itself: it states what is actually going to be done - the
                        chosen response to the forces laid out in the context. It is written in
                        active, assertive voice, in the present or imperative tense, as a committed
                        position rather than a discussion. The following usually goes into it:

                        -   the choice itself (clearly and unambiguously); and
                        -   the essence of how (enough of the approach to make the choice concrete
                            - the mechanism, pattern, or technology - but not a full implementation
                            specification).

                        It is a declaration, not a deliberation, usually using the wording "We
                        use..." or "We do...", active, definite, owning the choice. Avoid hedging
                        ("we might", "we could consider") - the deliberation already happened, the
                        decision records the verdict.
                -   name: WHY
                    desc: |
                        The **Rationale** of the decision: it is the reasoning that justifies the
                        decision - the bridge that explains why this choice, given those forces. It
                        answers "Of all the things we could have done, why was this the right
                        one?". Where the context states the forces and the decision states the
                        choice, the rationale is the logical connective tissue between them - it
                        shows that the decision actually follows from the context. The following
                        usually goes into it:

                        -   the deciding factors (which forces from the context carried the most
                            weight, and how the chosen option satisfies them best);
                        -   the trade-off reasoning (what was optimized for and what was knowingly
                            sacrificed - naming the trade-off is the heart of rationale);
                        -   why the alternatives lost (the comparative argument: "option B failed
                            on X, option C cost too much on Y"); and
                        -   assumptions and evidence (benchmarks, prior experience, constraints, or
                            principles the reasoning rests on).
                -   name: NOTES
                    desc: |
                        The **Background** of the decision: it is *OPTIONAL* and can be omitted
                        when it does not add genuine value - most decisions won't need it. The
                        following usually goes into it:

                        -   information about the decision *process* (e.g. a weighted decision
                            matrix of considered alternatives);
                        -   consequences of the decision (but only when non-obvious downstream
                            effects need to be called out); and
                        -   links to strongly related decisions.
                    optional: true
