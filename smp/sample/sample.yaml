
-   kind: META
    name: Title
    file: sample.md
    props:
        -   name: TITLE
            desc: The title of the specification.
        -   name: SUBTITLE
            desc: The subtitle of the specification.
            optional: true
-   kind: SPEC
    name: Data Model
    file: sample.md
    id: DM
    desc: >
        The structure of named entities, with named attributes and directed relationships,
        of the data the solution manages, defining how information is organized and connected.
    refs: >
        -   Chen: The Entity-Relationship Model -- Toward a Unified View of Data (1976),
            https://dl.acm.org/doi/10.1145/320434.320440
        -   OMG UML 2.5.1: Unified Modeling Language (2017),
            https://www.omg.org/spec/UML/2.5.1
    diagram:
        type: graph
        nodes: "[[SPEC:DM.ENTITY:*]]"
        edges: "[[SPEC:DM.ENTITY:*.RELATION:*]]"
        config:
            size-node-height-scale:  8
            size-edge-port-gap:      60
            graph-node-degree-max:   4
            graph-channel-width-max: 300
            graph-channel-width-min: 300
    childs:
        -   kind: ENTITY
            name: "[A-Z][a-zA-Z0-9]*"
            desc: >
                A named entity of the data model, carrying a Pascal-cased, 1-3 word long,
                per-artifact unique name, and described by a 1-sentence description ("what")
                plus a 1-sentence rationale ("why").
            diagram:
                type: hub
                center: self
                nodes: "[[SPEC:DM.ENTITY:*]]"
                edges: "[[SPEC:DM.ENTITY:*.RELATION:*]]"
                config:
                    size-node-width-max: 440
            childs:
                -   kind: ATTRIBUTE
                    name: "[a-z][a-zA-Z0-9]*"
                    desc: >
                        A named attribute of the entity, carrying a camel-cased, 1-3 word long,
                        per-entity unique identifier, and described by a 1-sentence description
                        ("what") plus a 1-sentence rationale ("why").
                    props:
                        -   name: TYPE
                            desc: >
                                The type of the entity attribute, one of `boolean`, `string`
                                (short single-line text), `text` (long free-form text), `integer`,
                                `float` (approximate), `decimal` (exact, e.g. for money), `uuid`,
                                `bytes`, `date`, `time`, `datetime`, `duration` (time span), or
                                `enum(XXX,YYY[,...])`, optionally prefixed with the qualifier `key`
                                to indicate inclusion into the primary key of the entity or `unique`
                                to indicate an alternate uniqueness constraint, or optionally
                                suffixed with `?` to indicate an optional (nullable) value, where a
                                `key` or `unique` attribute cannot be optional.
                            value: /^(?!(?:key|unique)\s.*\?$)(?:(?:key|unique)\s+)?(?:boolean|string|text|integer|float|decimal|uuid|bytes|date|time|datetime|duration|enum\((?:[A-Za-z0-9_]+)(?:,\s*[A-Za-z0-9_]+)*\))(?:\?)?$/
                        -   name: DEFAULT
                            desc: The default value of the entity attribute.
                            value: /.*/
                            optional: true
                -   kind: RELATION
                    name: "[a-z][a-zA-Z0-9]*"
                    desc: >
                        A named directed relation of the entity, carrying a camel-cased, 1-3 word
                        long, per-entity unique identifier and targeting another entity, and
                        described by a 1-sentence description ("what") plus a 1-sentence rationale
                        ("why"). A relation carries no attributes of its own: a relation needing
                        attributes (an "association class") is reified as an entity of its own,
                        related from both sides.
                    optional: true
                    props:
                        -   name: TARGET
                            desc: Reference to the DATA-MODEL entity the directed relation targets.
                            value: "[[SPEC:DM.ENTITY:*]]"
                        -   name: ARITY
                            desc: >
                                The arity (cardinality) of the relation at the target entity: `0..1`
                                or `?` for zero or one ("optional"), `1` for exactly one
                                ("mandatory"), `0..n` or `*` for zero or more, `1..n` or `+` for one
                                or more, or `{n}`/`{n,m}` for an exact number or range; defaults to
                                `1`.
                            value: /^(?:\?|\*|\+|\{\d+(?:,\d+)?\}|1|0\.\.1|0\.\.n|1\.\.n|\d+\.\.\d+)$/
                            optional: true

