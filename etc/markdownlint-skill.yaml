#   markdownlint-cli2 configuration for linting the Markdown skills
config:
    default: true

    #   Setext headings on the two top levels, ATX headings below
    MD003:
        style: setext_with_atx

    #   4-space list indentation with 3 (unordered) and 2 (ordered) spaces after the list marker
    MD007:
        indent: 4
    MD030:
        ul_single: 3
        ul_multi:  3
        ol_single: 2
        ol_multi:  2

    #   output templates intentionally carry over-long literal lines
    MD013: false

    #   same heading text is allowed below different parent headings
    MD024:
        siblings_only: true

    #   pseudo-XML elements like <template/> and <if/> are the skill notation
    MD033: false

    #   code spans like `, BECAUSE ` intentionally carry the separator spaces
    MD038: false

    #   fenced code blocks of diagrams and examples carry no language
    MD040: false
